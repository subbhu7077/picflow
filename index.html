<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000">
<title>PicFlow</title>
<link rel="icon" href="data:,">

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
img,video{max-width:100%}
.hidden{display:none!important}
#app{max-width:620px;margin:auto;min-height:100vh;background:#000}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.authbox{width:100%;max-width:390px}
.logo{text-align:center;font-size:43px;font-weight:900;margin-bottom:35px;letter-spacing:-2px}
.input{width:100%;padding:14px;margin:6px 0;border:1px solid #292929;background:#151515;color:#fff;border-radius:10px;outline:none}
.input:focus{border-color:#777}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800;margin-top:8px}
.secondary{width:100%;padding:13px;border:1px solid #333;border-radius:10px;background:#111;color:#fff;margin-top:9px}
.link{text-align:center;color:#aaa;margin:17px;cursor:pointer}

.top{height:58px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,.95);border-bottom:1px solid #222}
.logo2{font-size:25px;font-weight:900}
.topicons{display:flex;gap:20px;font-size:24px}
.page{padding-bottom:72px}

.stories{display:flex;gap:14px;overflow-x:auto;padding:14px;border-bottom:1px solid #222}
.stories::-webkit-scrollbar{display:none}
.story{min-width:66px;text-align:center;font-size:11px;color:#aaa}
.storyring{width:60px;height:60px;padding:2px;margin:auto;border-radius:50%;background:linear-gradient(45deg,#ff0,#f06,#80f)}
.storyring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000}

.create{margin:12px;padding:12px;border:1px solid #222;border-radius:13px;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222}
.fakeinput{flex:1;background:#171717;border-radius:25px;padding:12px;color:#888}

.post{border-bottom:1px solid #222;margin-bottom:5px}
.posthead{display:flex;align-items:center;gap:10px;padding:12px}
.postuser{flex:1;font-weight:800}
.postmedia{width:100%;max-height:680px;object-fit:cover;background:#111}
.actions{display:flex;gap:20px;padding:10px 13px;font-size:26px}
.action{cursor:pointer}
.info{padding:0 13px 15px}
.likes{font-weight:800;margin-bottom:6px}
.caption{line-height:1.4}
.commentlink{color:#888;margin-top:7px;cursor:pointer}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;height:64px;background:rgba(0,0,0,.97);border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:50}
.nav{text-align:center;font-size:24px;color:#aaa;cursor:pointer}
.nav.active{color:#fff}
.nav small{display:block;font-size:9px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#111;border-radius:22px 22px 0 0;padding:18px}
.close{float:right;border:0;background:#292929;color:#fff;border-radius:50%;width:35px;height:35px;font-size:22px}
.title{font-size:23px;font-weight:900;margin:4px 0 20px}
.person{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #222}
.personinfo{flex:1}
.personinfo b{display:block}
.personinfo span{font-size:12px;color:#888}
.follow{border:0;background:#fff;color:#000;border-radius:8px;padding:8px 14px;font-weight:800}
.following{background:#222;color:#fff;border:1px solid #444}

.profilehead{display:flex;gap:20px;align-items:center;padding:10px 0}
.bigavatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#222}
.stats{display:flex;gap:20px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:#888}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:15px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover}
.setting{padding:17px 4px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.empty{text-align:center;color:#777;padding:50px 20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#fff;color:#000;padding:11px 18px;border-radius:25px;z-index:999;font-weight:800;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:7px;min-height:250px}
.bubble{max-width:78%;padding:10px 13px;border-radius:18px;background:#222;align-self:flex-start}
.bubble.me{background:#fff;color:#000;align-self:flex-end}
.chatbar{display:flex;gap:7px;margin-top:10px}
.chatbar input{flex:1}
.chatbar button{width:55px;border:0;border-radius:10px}
.preview{max-height:300px;display:block;margin:10px auto;border-radius:12px}
</style>
</head>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=master3"></script>
<script src="js/master.js?v=master3"></script>
</body>
</html>
