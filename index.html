<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PicFlow - Reels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; }

    .app-root { max-width: 480px; margin: 0 auto; height: 100vh; background: #000; position: relative; overflow: hidden; }

    /* ================= EXACT SCREENSHOT REELS UI ================= */
    .reels-screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* Top Overlay Bar */
    .reels-top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 50; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .reels-top-nav i { font-size: 24px; cursor: pointer; color: #fff; }
    .reels-dropdown-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .reels-dropdown-title i { font-size: 13px; margin-top: 2px; }

    /* Center Stage Video Player */
    .reels-player-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    .reels-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    /* Double Tap Big Heart */
    .heart-burst { position: absolute; font-size: 90px; color: #ff3040; opacity: 0; transform: scale(0.3); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 30; }
    .heart-burst.pop { opacity: 0.95; transform: scale(1.15); }

    /* Play/Pause Watermark */
    .reel-play-pop { position: absolute; font-size: 60px; color: rgba(255,255,255,0.8); opacity: 0; transform: scale(0.6); transition: all 0.25s ease; pointer-events: none; z-index: 30; }
    .reel-play-pop.show { opacity: 1; transform: scale(1); }

    /* Right Action Sidebar */
    .reels-sidebar { position: absolute; bottom: 75px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 40; }
    .reel-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .reel-btn i { font-size: 26px; color: #fff; transition: transform 0.1s ease; }
    .reel-btn i:active { transform: scale(1.25); }
    .reel-btn span { font-size: 11.5px; font-weight: 600; color: #fff; }
    .reel-liked-heart { color: #ff2b54 !important; }
    .reel-saved-white { color: #fff !important; }

    /* Corner Album Music Thumbnail */
    .reel-album-art { width: 30px; height: 30px; border-radius: 6px; border: 2px solid #fff; overflow: hidden; animation: albumSpin 4s linear infinite; margin-top: 4px; }
    .reel-album-art img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes albumSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Bottom Info Layer */
    .reels-info { position: absolute; bottom: 70px; left: 16px; right: 80px; z-index: 40; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .reels-author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .reels-author-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.6); }
    .reels-author-name { font-size: 14px; font-weight: 700; color: #fff; }
    
    /* White Follow Pill Button */
    .reels-follow-pill { background: transparent; border: 1px solid #fff; color: #fff; padding: 4px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .reels-follow-pill.following { background: rgba(255,255,255,0.2); border-color: transparent; }

    .reels-caption { font-size: 13.5px; line-height: 1.4; color: #fff; margin-bottom: 8px; max-height: 40px; overflow: hidden; }
    
    /* Audio Tag Bar */
    .reels-audio-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #eee; cursor: pointer; }
    .reels-audio-bar i { font-size: 11px; }
    .reels-audio-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }

    /* Bottom Dock Bar */
    nav.reels-dock { position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    nav.reels-dock i { font-size: 21px; color: #fff; cursor: pointer; }
    .dock-avatar { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover; cursor: pointer; }

    /* Quick Upload Reel Modal */
    .upload-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 18px; }
    .upload-card { background: #161616; width: 100%; max-width: 400px; border-radius: 14px; padding: 20px; border: 1px solid #282828; position: relative; }
    .upload-card h3 { margin-bottom: 14px; font-size: 17px; }
    .upload-card input { width: 100%; background: #222; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 13px; }
    .btn-submit { width: 100%; padding: 10px; background: #0095f6; color: #fff; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    .close-modal { position: absolute; top: 18px; right: 18px; font-size: 18px; cursor: pointer; color: #888; }
  </style>
</head>
<body>

<div class="app-root">
  <div class="reels-screen" id="reelContainer">
    <!-- Top Bar Overlay -->
    <div class="reels-top-nav">
      <i class="fa-solid fa-plus" onclick="openUploadModal()" title="Add Reel"></i>
      <div class="reels-dropdown-title" onclick="alert('Viewing: Following & Trending Reels')">
        <span>Reels</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <i class="fa-solid fa-camera" onclick="openUploadModal()" title="Record Reel"></i>
    </div>

    <!-- Video Stage -->
    <div class="reels-player-wrapper" onclick="handleStageTap()" ondblclick="handleStageDoubleTap(event)">
      <video class="reels-video" id="reelVideo" playsinline loop preload="auto"></video>
      <i class="fa-solid fa-play reel-play-pop" id="playIcon"></i>
      <i class="fa-solid fa-heart heart-burst" id="burstHeart"></i>
    </div>

    <!-- Right Sidebar Icons -->
    <div class="reels-sidebar">
      <div class="reel-btn" onclick="toggleLike()">
        <i class="fa-solid fa-heart" id="likeIcon"></i>
        <span id="likeCountText">28K</span>
      </div>

      <div class="reel-btn" onclick="alert('Comments: 46 comments loaded!')">
        <i class="fa-regular fa-comment"></i>
        <span id="commentCountText">46</span>
      </div>

      <div class="reel-btn" onclick="handleRemix()">
        <i class="fa-solid fa-retweet"></i>
        <span id="repostCountText">1,178</span>
      </div>

      <div class="reel-btn" onclick="handleShare()">
        <i class="fa-regular fa-paper-plane"></i>
        <span id="shareCountText">1,568</span>
      </div>

      <div class="reel-btn" onclick="toggleSave()">
        <i class="fa-regular fa-bookmark" id="saveIcon"></i>
        <span id="saveCountText">2,160</span>
      </div>

      <div class="reel-btn" onclick="alert('Options:\n• Report\n• Not interested\n• Copy link\n• Save audio')">
        <i class="fa-solid fa-ellipsis"></i>
      </div>

      <!-- Bottom Audio Disc Album Art -->
      <div class="reel-album-art" onclick="toggleAudio()">
        <img id="musicThumbImg" src="https://picsum.photos/100/100?random=88" />
      </div>
    </div>

    <!-- Bottom Creator & Track Details -->
    <div class="reels-info">
      <div class="reels-author-row">
        <img id="creatorAvatar" src="https://picsum.photos/100/100?random=1" />
        <span class="reels-author-name" id="creatorUsername">ezybeacar</span>
        <button class="reels-follow-pill" id="btnFollow" onclick="toggleFollow(this)">Follow</button>
      </div>
      
      <p class="reels-caption" id="reelCaption">Desert off-roading SUV test 🚙💨 挣很多钱 去很多地方....</p>
      
      <div class="reels-audio-bar" onclick="toggleAudio()">
        <i class="fa-solid fa-music"></i>
        <span class="reels-audio-title" id="reelAudioTag">UMPSTYLE (Slowed) TV • Original Audio</span>
      </div>
    </div>

    <!-- Bottom Instagram Dock -->
    <nav class="reels-dock">
      <i class="fa-solid fa-house" onclick="alert('Home Feed')"></i>
      <i class="fa-solid fa-magnifying-glass" onclick="alert('Explore')"></i>
      <i class="fa-solid fa-clapperboard" style="color: #fff;" onclick="window.scrollTo({top:0, behavior:'smooth'})"></i>
      <i class="fa-regular fa-heart" onclick="alert('Notifications')"></i>
      <img src="https://picsum.photos/100/100?random=1" class="dock-avatar" id="dockAvatar" onclick="alert('Profile: Subbhubhai.official')" />
    </nav>
  </div>

  <!-- Upload Modal -->
  <div class="upload-modal" id="uploadModal">
    <div class="upload-card">
      <i class="fa-solid fa-xmark close-modal" onclick="closeUploadModal()"></i>
      <h3>Upload Reel Video</h3>
      <input type="file" id="videoFilePicker" accept="video/*" />
      <input type="text" id="videoCaptionField" placeholder="Write caption..." />
      <button class="btn-submit" onclick="submitCustomReel()">Share Reel</button>
    </div>
  </div>
</div>

<script>
// ==================== REELS DATABASE ====================
const REELS_DATA = [
  {
    id: "reel_offroad",
    video: "https://assets.mixkit.co/videos/preview/mixkit-driving-through-the-streets-of-a-modern-city-at-night-42284-large.mp4",
    user: "ezybeacar",
    avatar: "https://picsum.photos/100/100?random=10",
    caption: "Desert off-roading SUV test 🚙💨 挣很多钱 去很多地方....",
    music: "UMPSTYLE (Slowed) TV • Original Audio",
    likes: "28K",
    comments: "46",
    reposts: "1,178",
    shares: "1,568",
    saves: "2,160",
    isLiked: true,
    isSaved: false
  },
  {
    id: "reel_waves",
    video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-view-of-waves-coming-to-the-shore-41586-large.mp4",
    user: "Subbhubhai.official",
    avatar: "https://picsum.photos/100/100?random=1",
    caption: "Ocean waves sunset vibe 🌊✨ Relaxing therapy",
    music: "Apna Bana Le - Arijit Singh",
    likes: "58.4K",
    comments: "312",
    reposts: "3,410",
    shares: "4,200",
    saves: "5,120",
    isLiked: false,
    isSaved: false
  },
  {
    id: "reel_skate",
    video: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-skater-riding-a-skateboard-41604-large.mp4",
    user: "skater_girl",
    avatar: "https://picsum.photos/100/100?random=3",
    caption: "Golden hour skate session 🛹🔥 Practice makes perfect!",
    music: "Starboy - The Weeknd",
    likes: "94.1K",
    comments: "820",
    reposts: "2,190",
    shares: "3,150",
    saves: "4,820",
    isLiked: false,
    isSaved: false
  }
];

let currentIndex = 0;
let isMuted = false;
let singleTapTimer = null;

const videoEl = document.getElementById("reelVideo");

function renderReel(index) {
  const item = REELS_DATA[index];
  videoEl.src = item.video;
  videoEl.muted = isMuted;

  document.getElementById("creatorUsername").innerText = item.user;
  document.getElementById("creatorAvatar").src = item.avatar;
  document.getElementById("reelCaption").innerText = item.caption;
  document.getElementById("reelAudioTag").innerText = item.music;
  document.getElementById("musicThumbImg").src = item.avatar;

  document.getElementById("likeCountText").innerText = item.likes;
  document.getElementById("commentCountText").innerText = item.comments;
  document.getElementById("repostCountText").innerText = item.reposts;
  document.getElementById("shareCountText").innerText = item.shares;
  document.getElementById("saveCountText").innerText = item.saves;

  const likeIcon = document.getElementById("likeIcon");
  if (item.isLiked) {
    likeIcon.className = "fa-solid fa-heart reel-liked-heart";
  } else {
    likeIcon.className = "fa-solid fa-heart";
  }

  const saveIcon = document.getElementById("saveIcon");
  if (item.isSaved) {
    saveIcon.className = "fa-solid fa-bookmark reel-saved-white";
  } else {
    saveIcon.className = "fa-regular fa-bookmark";
  }

  videoEl.play().catch(() => {});
}

// Single Tap Play / Pause
function handleStageTap() {
  if (singleTapTimer) return;
  singleTapTimer = setTimeout(() => {
    singleTapTimer = null;
    const icon = document.getElementById("playIcon");
    if (videoEl.paused) {
      videoEl.play();
      icon.className = "fa-solid fa-play reel-play-pop show";
    } else {
      videoEl.pause();
      icon.className = "fa-solid fa-pause reel-play-pop show";
    }
    setTimeout(() => icon.classList.remove("show"), 450);
  }, 220);
}

// Double Tap Heart Burst & Like
function handleStageDoubleTap(e) {
  clearTimeout(singleTapTimer);
  singleTapTimer = null;

  const burst = document.getElementById("burstHeart");
  burst.classList.add("pop");
  setTimeout(() => burst.classList.remove("pop"), 500);

  const item = REELS_DATA[currentIndex];
  item.isLiked = true;
  document.getElementById("likeIcon").className = "fa-solid fa-heart reel-liked-heart";
}

function toggleLike() {
  const item = REELS_DATA[currentIndex];
  item.isLiked = !item.isLiked;
  const icon = document.getElementById("likeIcon");
  if (item.isLiked) {
    icon.className = "fa-solid fa-heart reel-liked-heart";
  } else {
    icon.className = "fa-solid fa-heart";
  }
}

function toggleSave() {
  const item = REELS_DATA[currentIndex];
  item.isSaved = !item.isSaved;
  const icon = document.getElementById("saveIcon");
  if (item.isSaved) {
    icon.className = "fa-solid fa-bookmark reel-saved-white";
  } else {
    icon.className = "fa-regular fa-bookmark";
  }
}

function toggleFollow(btn) {
  if (btn.innerText === "Follow") {
    btn.innerText = "Following";
    btn.classList.add("following");
  } else {
    btn.innerText = "Follow";
    btn.classList.remove("following");
  }
}

function handleRemix() {
  alert("Remix this reel: Camera & Split screen ready!");
}

function handleShare() {
  if (navigator.share) {
    navigator.share({ title: 'Instagram Reel', url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Reel link copied to clipboard! 🔗");
  }
}

function toggleAudio() {
  isMuted = !isMuted;
  videoEl.muted = isMuted;
  const icon = document.getElementById("reelMuteIcon");
  icon.className = isMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
}

function advanceReel(direction) {
  currentIndex = (currentIndex + direction + REELS_DATA.length) % REELS_DATA.length;
  renderReel(currentIndex);
}

// Vertical Swipe Gestures
let startY = 0;
let endY = 0;
const container = document.getElementById("reelContainer");

container.addEventListener("touchstart", e => {
  startY = e.changedTouches[0].screenY;
}, { passive: true });

container.addEventListener("touchend", e => {
  endY = e.changedTouches[0].screenY;
  const diff = startY - endY;
  if (Math.abs(diff) > 40) {
    if (diff > 0) advanceReel(1); // Swipe UP -> Next
    else advanceReel(-1);        // Swipe DOWN -> Prev
  }
}, { passive: true });

// Custom Reel Upload
function openUploadModal() { document.getElementById("uploadModal").style.display = "flex"; }
function closeUploadModal() { document.getElementById("uploadModal").style.display = "none"; }

function submitCustomReel() {
  const file = document.getElementById("videoFilePicker").files[0];
  const caption = document.getElementById("videoCaptionField").value;

  if (!file) {
    alert("Please choose a video file!");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    REELS_DATA.unshift({
      id: "reel_" + Date.now(),
      video: e.target.result,
      user: "Subbhubhai.official",
      avatar: "https://picsum.photos/100/100?random=1",
      caption: caption || "My New Reel 🎬🔥",
      music: "Original Audio • Subbhu",
      likes: "1",
      comments: "0",
      reposts: "0",
      shares: "0",
      saves: "0",
      isLiked: false,
      isSaved: false
    });
    currentIndex = 0;
    renderReel(0);
    closeUploadModal();
    alert("Reel uploaded successfully! 🎬");
  };
  reader.readAsDataURL(file);
}

// Initial Bootup
window.addEventListener("DOMContentLoaded", () => {
  renderReel(0);
});
</script>
</body>
</html>
