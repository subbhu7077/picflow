<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicFlow</title>
  <link rel="stylesheet" href="css/style.css?v=11">
</head>

<body>

<div id="app">

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="auth-screen">

    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">📸</div>
        <h1>PicFlow</h1>
        <p>Share moments. Connect people.</p>
      </div>

      <div class="auth-form">

        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

        <label>Mobile Number</label>
        <input
          id="loginMobile"
          type="tel"
          placeholder="Enter mobile number"
          maxlength="10"
          inputmode="numeric"
        >

        <label>Password</label>

        <div class="password-box">
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
          >
          <button type="button" onclick="togglePassword()">👁️</button>
        </div>

        <button class="login-btn" onclick="loginUser()">
          Login
        </button>

        <button class="facebook-btn" onclick="facebookLogin()">
          <span>f</span>
          Continue with Facebook
        </button>

        <button class="forgot-btn" onclick="forgotPassword()">
          Forgot password?
        </button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <p class="signup-text">
          Don't have an account?
        </p>

        <button class="signup-btn" onclick="showSignup()">
          Create new account
        </button>

      </div>

    </div>

  </section>



  <!-- SIGNUP SCREEN -->
  <section id="signupScreen" class="auth-screen" style="display:none;">

    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">📸</div>
        <h1>Create Account</h1>
        <p>Join PicFlow and share your moments.</p>
      </div>

      <div class="auth-form">

        <div class="signup-photo" onclick="chooseSignupPhoto()">
          <div id="signupPhotoPreview" class="signup-photo-preview">
            👤
          </div>
          <div>
            <strong>Add Profile Photo</strong>
            <small>Tap to choose a photo</small>
          </div>
        </div>

        <label>Username</label>
        <input
          id="signupUsername"
          type="text"
          placeholder="Choose a username"
          maxlength="30"
        >

        <label>Email</label>
        <input
          id="signupEmail"
          type="email"
          placeholder="Enter your email"
        >

        <label>Mobile Number</label>
        <input
          id="signupMobile"
          type="tel"
          placeholder="10 digit mobile number"
          maxlength="10"
          inputmode="numeric"
        >

        <label>Password</label>
        <div class="password-box">
          <input
            id="signupPassword"
            type="password"
            placeholder="Create password"
          >
          <button type="button" onclick="toggleSignupPassword()">
            👁️
          </button>
        </div>

        <label>Confirm Password</label>
        <div class="password-box">
          <input
            id="signupConfirmPassword"
            type="password"
            placeholder="Confirm password"
          >
          <button type="button" onclick="toggleConfirmPassword()">
            👁️
          </button>
        </div>

        <button class="login-btn" onclick="createAccount()">
          Create Account
        </button>

        <button class="back-login-btn" onclick="showLogin()">
          ← Back to Login
        </button>

      </div>

    </div>

  </section>

  <!-- MAIN APP -->
  <section id="mainApp" style="display:none;">

    <header class="top-header">
      <div class="logo">PicFlow</div>
      <div class="header-icons">
        <button onclick="showMessage('Notifications coming soon 🔔')">♡</button>
        <button onclick="showMessage('Messages coming soon 💬')">✈</button>
      </div>
    </header>

    <main>

      <div class="stories">
        <div class="story">
          <div class="story-avatar">Y</div>
          <small>Your story</small>
        </div>

        <div class="story">
          <div class="story-avatar">A</div>
          <small>Alex</small>
        </div>

        <div class="story">
          <div class="story-avatar">R</div>
          <small>Rahul</small>
        </div>

        <div class="story">
          <div class="story-avatar">S</div>
          <small>Sarah</small>
        </div>
      </div>


      <div class="post">

        <div class="post-header">
          <div class="avatar">Y</div>

          <div>
            <strong id="homeUsername">You</strong>
            <small>Thane, India</small>
          </div>
        </div>

        <div class="post-image">
          <div class="demo-image">📸</div>
        </div>

        <div class="post-actions">
          <button onclick="toggleLike(this)">♡</button>
          <button onclick="commentPost()">💬</button>
          <button onclick="sharePost()">✈</button>
          <button onclick="toggleSave(this)">🔖</button>
        </div>

        <div class="likes">
          <span class="like-count">0</span> likes
        </div>

        <p>
          <strong id="postUsername">You</strong>
          Welcome to PicFlow! 🚀
        </p>

      </div>

    </main>


    <nav class="bottom-nav">

      <button class="nav-btn" onclick="navigate('Home')">
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button class="nav-btn" onclick="showMessage('Search coming soon 🔍')">
        <span>⌕</span>
        <small>Search</small>
      </button>

      <button class="nav-btn create-btn" onclick="createPost()">
        <span>＋</span>
        <small>Create</small>
      </button>

      <button class="nav-btn" onclick="showMessage('Reels coming soon 🎬')">
        <span>▶</span>
        <small>Reels</small>
      </button>

      <button class="nav-btn" onclick="navigate('Profile')">
        <span>●</span>
        <small>Profile</small>
      </button>

    </nav>

  </section>

</div>


<script src="js/app.js?v=11"></script>

</body>
</html>
