<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PicFlow - Official Verified</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; padding-bottom: 58px; overflow-x: hidden; }

    .app-root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #000; position: relative; }

    /* Top Bar */
    header { position: sticky; top: 0; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1c1c1c; z-index: 90; }
    .logo { font-size: 26px; font-weight: bold; font-family: 'Brush Script MT', cursive, sans-serif; cursor: pointer; }
    .header-actions { display: flex; gap: 20px; font-size: 21px; align-items: center; }
    .header-actions i { cursor: pointer; position: relative; }
    .notif-badge { position: absolute; top: -5px; right: -6px; background: #ed4956; width: 8px; height: 8px; border-radius: 50%; }

    .verified-tick { color: #0095f6; font-size: 13px; margin-left: 4px; display: inline-flex; align-items: center; }

    /* Views */
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* Stories */
    .stories-scroller { display: flex; gap: 14px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1c1c1c; background: #000; }
    .stories-scroller::-webkit-scrollbar { display: none; }
    .story-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; min-width: 66px; }
    .story-ring-wrap { width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); display: flex; align-items: center; justify-content: center; position: relative; }
    .story-ring-wrap.self-empty { background: transparent; border: 1.5px dashed #444; }
    .story-thumb-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #000; background: #181818; }
    .story-add-badge { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: #0095f6; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #fff; }

    /* Mind Bar */
    .whats-on-mind { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #141414; background: #080808; cursor: pointer; }
    .mind-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .mind-input-faux { flex: 1; background: #1c1c1c; border-radius: 20px; padding: 9px 16px; color: #777; font-size: 13px; }

    /* Feed Posts */
    .post-wall { display: flex; flex-direction: column; width: 100%; }
    .post-block { border-bottom: 1px solid #1c1c1c; padding-bottom: 12px; margin-bottom: 4px; }
    .post-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
    .post-user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .post-user-pfp { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .post-author-row { display: flex; align-items: center; gap: 2px; }
    .post-author { font-size: 13px; font-weight: 600; }

    .post-stage { position: relative; width: 100%; aspect-ratio: 1/1; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .post-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .heart-burst { position: absolute; font-size: 85px; color: #ff3040; opacity: 0; transform: scale(0.3); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 10; }
    .heart-burst.pop { opacity: 0.95; transform: scale(1.15); }

    .post-action-bar { display: flex; justify-content: space-between; padding: 10px 14px 6px; font-size: 22px; }
    .post-action-left { display: flex; gap: 18px; }
    .post-action-bar i { cursor: pointer; transition: transform 0.1s ease; }
    .liked-red { color: #ed4956 !important; }
    .saved-gold { color: #fff !important; }

    .post-caption-box { padding: 0 14px; font-size: 13px; line-height: 1.4; }
    .likes-stat { font-weight: 600; margin-bottom: 4px; }
    .caption-content span { font-weight: 600; margin-right: 6px; }
    .comments-view { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
    .comment-line span { font-weight: 600; margin-right: 6px; }

    /* Quick Comment Bar */
    .quick-comment-bar { display: flex; padding: 8px 14px; border-top: 1px solid #141414; margin-top: 8px; }
    .quick-comment-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
    .quick-comment-bar button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; font-size: 13px; }

    /* Explore Tab */
    .explore-search-wrap { padding: 12px 14px; }
    .explore-search-input { width: 100%; background: #262626; border: none; border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; font-size: 14px; }
    .explore-grid-wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .explore-grid-wall img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; background: #111; }

    /* Reels Viewport */
    #reelsTab { position: relative; height: calc(100vh - 58px); overflow: hidden; background: #000; }
    .reel-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: pan-y; }
    .reel-video-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    .reel-video-element { width: 100%; height: 100%; object-fit: cover; }
    .reel-floating-state-icon { position: absolute; font-size: 55px; color: rgba(255,255,255,0.85); pointer-events: none; opacity: 0; transform: scale(0.6); transition: all 0.25s ease; z-index: 10; }
    .reel-floating-state-icon.show { opacity: 1; transform: scale(1); }
    .reel-mute-btn { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; z-index: 25; cursor: pointer; }
    .reel-info-layer { position: absolute; bottom: 16px; left: 14px; right: 75px; z-index: 20; }
    .reel-user-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .reel-user-badge img { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover; }
    .reel-user-name { font-size: 14px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 4px; }
    .reel-caption-text { font-size: 13px; line-height: 1.35; color: #f0f0f0; margin-bottom: 8px; }
    .reel-sidebar-actions { position: absolute; bottom: 20px; right: 14px; display: flex; flex-direction: column; gap: 18px; align-items: center; z-index: 20; }
    .reel-action-bubble { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 25px; cursor: pointer; }
    .reel-action-bubble span { font-size: 12px; font-weight: 500; }

    /* Notifications Tab */
    .notif-list-wall { display: flex; flex-direction: column; }
    .notif-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #141414; font-size: 13px; }
    .notif-user-flex { display: flex; align-items: center; gap: 12px; }
    .notif-pfp { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
    .notif-follow-btn { background: #0095f6; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }

    /* Profile Tab */
    .profile-canvas { padding: 18px 16px; }
    .profile-bio-header { display: flex; align-items: center; justify-content: space-between; }
    .profile-hero-pic-wrap { position: relative; width: 84px; height: 84px; cursor: pointer; }
    .profile-hero-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid #262626; background: #222; }
    .profile-camera-badge { position: absolute; bottom: 2px; right: 2px; background: #0095f6; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 2px solid #000; }
    .profile-metrics-deck { display: flex; gap: 22px; text-align: center; }
    .profile-metrics-deck strong { display: block; font-size: 16px; }
    .profile-metrics-deck span { font-size: 12px; color: #888; }
    .profile-bio-textblock { margin-top: 14px; }
    .profile-name-row { display: flex; align-items: center; gap: 6px; }
    .profile-name-row h4 { font-size: 15px; font-weight: 700; }
    .profile-bio-textblock p { font-size: 13px; color: #aaa; margin-top: 2px; }
    .profile-control-btn { width: 100%; padding: 8px; background: #262626; color: #fff; font-weight: 600; border: none; border-radius: 8px; margin-top: 14px; cursor: pointer; font-size: 13px; }
    .profile-grid-wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 20px; }
    .profile-grid-wall img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; background: #111; }

    /* Bottom Dock */
    nav.bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; align-items: center; z-index: 95; max-width: 480px; margin: 0 auto; }
    nav.bottom-dock i { font-size: 21px; color: #fff; cursor: pointer; }
    .profile-dock-icon { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover; cursor: pointer; }

    /* Modals & Sheets */
    .modal-overlay-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal-sheet-inner { background: #1a1a1a; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; position: relative; border: 1px solid #2a2a2a; }
    .modal-sheet-inner h3 { margin-bottom: 14px; font-size: 16px; }
    .modal-sheet-inner input, .modal-sheet-inner textarea { width: 100%; background: #262626; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; outline: none; font-size: 13px; }
    .btn-theme-blue { width: 100%; padding: 10px; background: #0095f6; color: #fff; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .close-sheet-icon { position: absolute; top: 16px; right: 16px; font-size: 18px; cursor: pointer; color: #aaa; }

    /* Story Player Viewer */
    #storyViewerApp { display: none; position: fixed; inset: 0; background: #000; z-index: 300; flex-direction: column; justify-content: center; }
    .story-progress-wire { width: 100%; height: 3px; background: rgba(255,255,255,0.3); position: absolute; top: 8px; left: 0; }
    .story-progress-meter { width: 0%; height: 100%; background: #fff; transition: width 4s linear; }
    .story-author-tag { position: absolute; top: 18px; left: 14px; display: flex; align-items: center; gap: 8px; z-index: 10; font-size: 13px; font-weight: 600; }
    .story-author-tag img { width: 34px; height: 34px; border-radius: 50%; }
    #storyViewerTargetImg { width: 100%; height: 100%; object-fit: contain; }

    /* DM Messenger Drawer */
    .dm-messenger-drawer { display: none; position: fixed; inset: 0; background: #000; z-index: 250; flex-direction: column; max-width: 480px; margin: 0 auto; }
    .dm-top-panel { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid #1c1c1c; }
    .dm-chat-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { max-width: 75%; padding: 9px 14px; border-radius: 16px; font-size: 13px; line-height: 1.3; }
    .chat-bubble.me { align-self: flex-end; background: #3797f0; color: #fff; }
    .chat-bubble.them { align-self: flex-start; background: #262626; color: #fff; }
    .chat-input-deck { display: flex; padding: 10px; border-top: 1px solid #1c1c1c; gap: 10px; background: #000; }
    .chat-input-deck input { flex: 1; background: #262626; border: none; border-radius: 20px; padding: 8px 14px; color: #fff; outline: none; font-size: 13px; }
    .chat-input-deck button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-root">
  <!-- Top Header -->
  <header>
    <div class="logo" onclick="switchView('feedTab'); window.scrollTo({top: 0, behavior: 'smooth'});">PicFlow</div>
    <div class="header-actions">
      <i class="fa-regular fa-heart" onclick="switchView('notifTab')">
        <span class="notif-badge"></span>
      </i>
      <i class="fa-brands fa-facebook-messenger" onclick="openMessenger()"></i>
    </div>
  </header>

  <!-- TAB 1: FEED -->
  <section id="feedTab" class="tab-section active">
    <div class="stories-scroller" id="storiesTray"></div>
    <div class="whats-on-mind" onclick="openCreatePostSheet()">
      <img src="https://picsum.photos/200/200?random=1" class="mind-avatar" id="mindBarAvatar" />
      <div class="mind-input-faux">What's on your mind?</div>
    </div>
    <div class="post-wall" id="postsContainer"></div>
  </section>

  <!-- TAB 2: EXPLORE -->
  <section id="exploreTab" class="tab-section">
    <div class="explore-search-wrap">
      <input type="text" class="explore-search-input" id="exploreSearchBox" placeholder="🔍 Search creators, tags..." oninput="handleExploreSearchLive()" />
    </div>
    <div class="explore-grid-wall" id="exploreGridWall"></div>
  </section>

  <!-- TAB 3: REELS -->
  <section id="reelsTab" class="tab-section">
    <div class="reel-viewport" id="reelViewport">
      <div class="reel-mute-btn" onclick="toggleReelAudio(event)">
        <i class="fa-solid fa-volume-high" id="reelMuteIcon"></i>
      </div>
      <div class="reel-video-wrapper" id="reelWrapper" onclick="handleReelTap()" ondblclick="handleReelDoubleTap()">

        <i class="fa-solid fa-play reel-floating-state-icon" id="reelPlayStateIcon"></i>
        <i class="fa-solid fa-heart heart-burst" id="reelBurstHeart"></i>

        <div class="reel-user-badge">

        <p class="reel-caption-text" id="reelCaptionContent"></p>

      <div class="reel-sidebar-actions">

          <i class="fa-solid fa-heart" id="reelHeartBtn"></i>

  <section id="profileTab" class="tab-section">

      <div class="profile-bio-header">

          <div class="profile-camera-badge"><i class="fa-solid fa-camera"></i></div>

        <div class="profile-metrics-deck">
          <div><strong id="profilePostCountNumber">0</strong><span>Posts</span></div>
          <div><strong>500M</strong><span>Followers</span></div>

      <button onclick="dispatchDirectMessage()">Send</button>
    </div>

<script>
// ==================== INDEXEDDB ENGINE ====================
let db;
const DB_NAME = "PicFlowMasterDB_v27";
const STORE_NAME = "posts_store";

function initDB(callback) {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      db.createObjectStore(STORE_NAME, { keyPath: "id" });
    }
  };
  req.onsuccess = function(e) {
    db = e.target.result;
    callback();
  };
  req.onerror = function() {
    callback();
  };
}

function savePostToDB(postObj, callback) {
  if (!db) return callback();
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).put(postObj);
  tx.oncomplete = () => callback();
  tx.onerror = () => callback();
}

function getAllPostsFromDB(callback) {
  if (!db) return callback([]);
  const tx = db.transaction([STORE_NAME], "readonly");
  const req = tx.objectStore(STORE_NAME).getAll();
  req.onsuccess = () => callback(req.result || []);
  req.onerror = () => callback([]);
}

// ==================== PERMANENT STATE ====================
const SAVED_PERMANENT_DP = localStorage.getItem("pf_permanent_dp") || "https://picsum.photos/200/200?random=1";
const SAVED_PERMANENT_USERNAME = localStorage.getItem("pf_permanent_username") || "Subbhubhai.official";
const SAVED_PERMANENT_BIO = localStorage.getItem("pf_permanent_bio") || "Official Creator & Tech Explorer ⚡";

let userProfile = {
  name: SAVED_PERMANENT_USERNAME,
  bio: SAVED_PERMANENT_BIO,
  avatar: SAVED_PERMANENT_DP,
  followers: "500M",
  isVerified: true
};

const SEED_DEFAULT_POST = {
  id: 101,
  username: userProfile.name,
  avatar: userProfile.avatar,
  image: "https://picsum.photos/800/800?random=181",
  caption: "Official Verified Creator Vibes ⚡💙",
  likes: 1284,
  liked: false,
  saved: false,
  comments: ["Congrats on 500M! 💙", "Awesome post bro 🔥"]
};

let globalPosts = [];

let stories = [
  { id: 1, user: "Your story", avatar: userProfile.avatar, img: "https://picsum.photos/800/1200?random=191" },
  { id: 2, user: "neha_v", avatar: "https://picsum.photos/200/200?random=3", img: "https://picsum.photos/800/1200?random=192" },
  { id: 3, user: "rahul_k", avatar: "https://picsum.photos/200/200?random=4", img: "https://picsum.photos/800/1200?random=193" }
];

const NOTIFICATIONS = [
  { id: 1, user: "neha_v", avatar: "https://picsum.photos/200/200?random=3", text: "liked your photo.", time: "2m", isFollow: false },
  { id: 2, user: "rahul_k", avatar: "https://picsum.photos/200/200?random=4", text: "started following you.", time: "30m", isFollow: true },
  { id: 3, user: "priya_art", avatar: "https://picsum.photos/200/200?random=5", text: "commented: Great capture! 🔥", time: "1h", isFollow: false }
];

const REEL_DATABASE = [

    id: "reel_1",
    video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-view-of-waves-coming-to-the-shore-41586-large.mp4",

// Navigation Views
function switchView(viewId) {
  document.querySelectorAll(".tab-section").forEach(sec => sec.classList.remove("active"));
  const el = document.getElementById(viewId);
  if (el) el.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (viewId === "exploreTab") renderExploreGrid();
  if (viewId === "profileTab") renderProfileSection();
  if (viewId === "notifTab") renderNotifications();

  if (viewId === "reelsTab") playCurrentReel();
  else pauseCurrentReel();
}

// Stories
function renderStories() {
  const container = document.getElementById("storiesTray");
  if (!container) return;
  let html = `
    <div class="story-slot" onclick="openCreateStorySheet()">
      <div class="story-ring-wrap self-empty">
        <img class="story-thumb-img" src="${userProfile.avatar}" />
        <div class="story-add-badge">+</div>
      </div>
      <span>Your story</span>
    </div>
  `;

  stories.forEach(s => {
    html += `
      <div class="story-slot" onclick="triggerStoryPlayer('${s.img}', '${s.user}', '${s.avatar}')">
        <div class="story-ring-wrap">
          <img class="story-thumb-img" src="${s.avatar}" />
        </div>
        <span>${s.user}</span>
      </div>
    `;
  });
  container.innerHTML = html;
}

let storyTimer = null;
function triggerStoryPlayer(imgUrl, userName, avatarUrl) {
  const player = document.getElementById("storyViewerApp");
  const meter = document.getElementById("storyMeterFill");
  document.getElementById("storyViewerTargetImg").src = imgUrl;
  document.getElementById("storyTargetUserName").innerText = userName;
  document.getElementById("storyTargetUserAvatar").src = avatarUrl;

  player.style.display = "flex";
  meter.style.width = "0%";
  setTimeout(() => { meter.style.width = "100%"; }, 40);

  clearTimeout(storyTimer);
  storyTimer = setTimeout(closeStoryPlayerApp, 4050);
}

function closeStoryPlayerApp() {
  clearTimeout(storyTimer);
  document.getElementById("storyViewerApp").style.display = "none";
  document.getElementById("storyMeterFill").style.width = "0%";
}

// Feed Posts
function renderFeed() {
  const wall = document.getElementById("postsContainer");
  if (!wall) return;

  const displayList = globalPosts.length ? globalPosts : [SEED_DEFAULT_POST];

  wall.innerHTML = displayList.map(p => `
    <article class="post-block" id="post-${p.id}">
      <div class="post-top">
        <div class="post-user-info" onclick="switchView('profileTab')">
          <img src="${p.avatar}" class="post-user-pfp" />
          <div class="post-user-text">
            <div class="post-author-row">
              <span class="post-author">${p.username}</span>
              <i class="fa-solid fa-circle-check verified-tick"></i>
            </div>
          </div>
        </div>
        <i class="fa-solid fa-ellipsis" style="color: #888; cursor: pointer;" onclick="deletePost(${p.id})"></i>
      </div>

      <div class="post-stage" ondblclick="fireDoubleTapHeart(${p.id})">
        <img src="${p.image}" loading="lazy" />
        <i class="fa-solid fa-heart heart-burst" id="burst-${p.id}"></i>
      </div>

      <div class="post-action-bar">
        <div class="post-action-left">
          <i class="${p.liked ? 'fa-solid fa-heart liked-red' : 'fa-regular fa-heart'}" onclick="togglePostLike(${p.id})"></i>
          <i class="fa-regular fa-comment" onclick="focusComment(${p.id})"></i>
          <i class="fa-regular fa-paper-plane" onclick="sharePost()"></i>
        </div>
        <i class="${p.saved ? 'fa-solid fa-bookmark saved-gold' : 'fa-regular fa-bookmark'}" onclick="togglePostSave(${p.id})"></i>
      </div>

      <div class="post-caption-box">
        <div class="likes-stat">${p.likes || 1} likes</div>
        <div class="caption-content"><span>${p.username}</span>${p.caption || ''}</div>
        <div class="comments-view">
          ${(p.comments || []).map(c => `<div class="comment-line"><span>User</span>${c}</div>`).join("")}
        </div>
      </div>

      <div class="quick-comment-bar">
        <input type="text" id="comment-input-${p.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') submitComment(${p.id})" />
        <button onclick="submitComment(${p.id})">Post</button>
      </div>
    </article>
  `).join("");
}

function fireDoubleTapHeart(id) {
  const burst = document.getElementById(`burst-${id}`);
  if (burst) {
    burst.classList.add("pop");
    setTimeout(() => burst.classList.remove("pop"), 500);
  }
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  if (!p.liked) {
    p.liked = true;
    p.likes = (p.likes || 0) + 1;
    savePostToDB(p, () => {});
    renderFeed();
  }
}

function togglePostLike(id) {
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  p.liked = !p.liked;
  p.likes = (p.likes || 1) + (p.liked ? 1 : -1);
  savePostToDB(p, () => {});
  renderFeed();
}

function togglePostSave(id) {
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  p.saved = !p.saved;
  savePostToDB(p, () => {});
  renderFeed();
}

function focusComment(id) {
  const el = document.getElementById(`comment-input-${id}`);
  if (el) el.focus();
}

function submitComment(id) {
  const input = document.getElementById(`comment-input-${id}`);
  if (!input || !input.value.trim()) return;
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  if (!p.comments) p.comments = [];
  p.comments.push(input.value.trim());
  savePostToDB(p, () => {});
  input.value = "";
  renderFeed();
}

function sharePost() {
  if (navigator.clipboard) navigator.clipboard.writeText(window.location.href);
  alert("Post link copied to clipboard! 🔗");
}

function deletePost(id) {
  if (confirm("Delete this post?")) {
    globalPosts = globalPosts.filter(p => p.id !== id);
    if (db) {
      const tx = db.transaction([STORE_NAME], "readwrite");
      tx.objectStore(STORE_NAME).delete(id);
    }
    renderFeed();
    renderProfileSection();
  }
}

// Upload Post
function openCreatePostSheet() { document.getElementById("createPostModal").style.display = "flex"; }
function closeCreatePostSheet() { document.getElementById("createPostModal").style.display = "none"; }

function dispatchNewPost() {
  const fileInput = document.getElementById("postImageUploadInput");
  const file = fileInput.files[0];
  const captionInput = document.getElementById("postCaptionTextInput");
  const btn = document.getElementById("btnPublishPost");

  if (!file) {
    alert("Please select a photo from gallery!");
    return;
  }

  btn.innerText = "Posting...";
  btn.disabled = true;

  const reader = new FileReader();
  reader.onload = function(e) {
    const newPost = {
      id: Date.now(),
      username: userProfile.name,
      avatar: userProfile.avatar,
      image: e.target.result,
      caption: captionInput.value || "",
      likes: 0,
      liked: false,
      saved: false,
      comments: []
    };

    savePostToDB(newPost, function() {
      globalPosts.unshift(newPost);
      renderFeed();
      renderProfileSection();

      closeCreatePostSheet();
      btn.innerText = "Share Post";
      btn.disabled = false;
      fileInput.value = "";
      captionInput.value = "";

      switchView("feedTab");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  };

  reader.onerror = function() {
    alert("File read error. Choose another image.");
    btn.innerText = "Share Post";
    btn.disabled = false;
  };

  reader.readAsDataURL(file);
}

// Upload Story
function openCreateStorySheet() { document.getElementById("createStoryModal").style.display = "flex"; }
function closeCreateStorySheet() { document.getElementById("createStoryModal").style.display = "none"; }

function dispatchNewStory() {
  const file = document.getElementById("storyImageUploadInput").files[0];
  if (!file) {
    alert("Please select a story image!");
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    stories.unshift({
      id: Date.now(),
      user: "Your story",
      avatar: userProfile.avatar,
      img: e.target.result
    });
    renderStories();
    closeCreateStorySheet();
    document.getElementById("storyImageUploadInput").value = "";
    alert("Story uploaded! 📸");
  };
  reader.readAsDataURL(file);
}

// Reels Engine
let activeReelIndex = 0;
let isReelMuted = false;
const reelVideoEl = document.getElementById("reelActiveVideo");

function mountReel(index) {
  const data = REEL_DATABASE[index];
  reelVideoEl.src = data.video;
  reelVideoEl.muted = isReelMuted;
  
  document.getElementById("reelAuthorName").innerHTML = `@${data.user} <i class="fa-solid fa-circle-check verified-tick"></i>`;
  document.getElementById("reelUserAvatar").src = data.avatar;
  document.getElementById("reelCaptionContent").innerText = data.caption || "";
  document.getElementById("reelLikesCount").innerText = data.likes || "1.2k";

  const btn = document.getElementById("reelHeartBtn");
  if (data.liked) btn.classList.add("liked-red");
  else btn.classList.remove("liked-red");

  playCurrentReel();
}

function playCurrentReel() {
  if (document.getElementById("reelsTab").classList.contains("active")) {
    reelVideoEl.play().catch(() => {});
  }
}

function pauseCurrentReel() {
  reelVideoEl.pause();
}

function advanceReel(step) {
  activeReelIndex = (activeReelIndex + step + REEL_DATABASE.length) % REEL_DATABASE.length;
  mountReel(activeReelIndex);
}

function handleReelTap() {
  const playIcon = document.getElementById("reelPlayStateIcon");
  if (reelVideoEl.paused) {
    reelVideoEl.play();
    playIcon.className = "fa-solid fa-play reel-floating-state-icon show";
  } else {
    reelVideoEl.pause();
    playIcon.className = "fa-solid fa-pause reel-floating-state-icon show";
  }
  setTimeout(() => playIcon.classList.remove("show"), 500);
}

function handleReelDoubleTap() {
  const burst = document.getElementById("reelBurstHeart");
  burst.classList.add("pop");
  setTimeout(() => burst.classList.remove("pop"), 500);
  const data = REEL_DATABASE[activeReelIndex];
  data.liked = true;
  document.getElementById("reelHeartBtn").classList.add("liked-red");
}

function toggleReelLike() {
  const data = REEL_DATABASE[activeReelIndex];
  data.liked = !data.liked;
  const btn = document.getElementById("reelHeartBtn");
  if (data.liked) btn.classList.add("liked-red");
  else btn.classList.remove("liked-red");
}

function toggleReelAudio(e) {
  e.stopPropagation();
  isReelMuted = !isReelMuted;
  reelVideoEl.muted = isReelMuted;
  document.getElementById("reelMuteIcon").className = isReelMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
}

// Notifications

    <div class="notif-item">
      <div class="notif-user-flex">
        <img src="${n.avatar}" class="notif-pfp" />

      ${n.isFollow ? `<button class="notif-follow-btn" onclick="this.innerText='Following'">Follow</button>` : `<i class="fa-solid fa-heart" style="color: #ed4956;"></i>`}

  `).join("");

// Messenger
function openMessenger() { document.getElementById("dmDrawer").style.display = "flex"; }
function closeMessenger() { document.getElementById("dmDrawer").style.display = "none"; }

function dispatchDirectMessage() {
  const input = document.getElementById("dmInputMessage");
  const msg = input.value.trim();
  if (!msg) return;

  const scroll = document.getElementById("dmChatScroll");
  scroll.innerHTML += `<div class="chat-bubble me">${msg}</div>`;
  input.value = "";
  scroll.scrollTop = scroll.scrollHeight;

  setTimeout(() => {
    scroll.innerHTML += `<div class="chat-bubble them">Received: "${msg}" 👍</div>`;
    scroll.scrollTop = scroll.scrollHeight;
  }, 600);
}

// Profile Section
function renderProfileSection() {
  document.getElementById("profileHeroName").innerText = userProfile.name;
  document.getElementById("profileHeroBio").innerText = userProfile.bio;
  document.getElementById("profileHeroPic").src = userProfile.avatar;
  document.getElementById("profileDockAvatar").src = userProfile.avatar;
  document.getElementById("mindBarAvatar").src = userProfile.avatar;

  const displayList = globalPosts.length ? globalPosts : [SEED_DEFAULT_POST];
  document.getElementById("profilePostCountNumber").innerText = displayList.length;

  const grid = document.getElementById("profileGridWall");
  if (grid) {
    grid.innerHTML = displayList.map(p => `<img src="${p.image}" onclick="switchView('feedTab')" />`).join("");
  }
}

function openProfileEditSheet() {
  document.getElementById("editProfileDisplayName").value = userProfile.name;
  document.getElementById("editProfileBioDetails").value = userProfile.bio;
  document.getElementById("editProfileModal").style.display = "flex";
}
function closeProfileEditSheet() { document.getElementById("editProfileModal").style.display = "none"; }

function saveProfileDetails() {
  const name = document.getElementById("editProfileDisplayName").value.trim();
  const bio = document.getElementById("editProfileBioDetails").value.trim();
  const picFile = document.getElementById("editProfilePicFile").files[0];

  if (name) userProfile.name = name;
  if (bio) userProfile.bio = bio;

  localStorage.setItem("pf_permanent_username", userProfile.name);
  localStorage.setItem("pf_permanent_bio", userProfile.bio);

  if (picFile) {
    const reader = new FileReader();
    reader.onload = function(e) {
      userProfile.avatar = e.target.result;
      localStorage.setItem("pf_permanent_dp", userProfile.avatar);
      renderProfileSection();
      renderFeed();
      renderStories();
      closeProfileEditSheet();
      alert("Profile permanently saved! 💙");
    };
    reader.readAsDataURL(picFile);
  } else {
    renderProfileSection();
    renderFeed();
    closeProfileEditSheet();
    alert("Profile permanently saved! 💙");
  }
}

function quickChangeDP() { document.getElementById("directDpFileInput").click(); }

function handleDirectDP(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    userProfile.avatar = e.target.result;
    localStorage.setItem("pf_permanent_dp", userProfile.avatar);
    renderProfileSection();
    renderFeed();
    renderStories();
    alert("DP permanently updated! 📸");
  };
  reader.readAsDataURL(file);
}

// Initial Bootup
window.addEventListener("DOMContentLoaded", () => {
  renderProfileSection();
  renderStories();
  initDB(function() {
    getAllPostsFromDB(function(savedPosts) {
      if (savedPosts && savedPosts.length) {
        globalPosts = savedPosts.sort((a, b) => b.id - a.id);
      }
      renderFeed();
      renderProfileSection();
    });
  });
  mountReel(0);
});
</script>
