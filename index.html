<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PicFlow - Verified Official</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-sub-bg: #1a1a1a;
      --border-color: #1c1c1c;
      --text-color: #ffffff;
      --sub-text: #888888;
      --input-bg: #222222;
      --hover-bg: #262626;
      --brand-blue: #0095f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-color); color: var(--text-color); padding-bottom: 58px; overflow-x: hidden; }

    .app-root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-color); position: relative; }

    /* Top Bar */
    header { position: sticky; top: 0; background: var(--bg-color); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); z-index: 90; }
    .logo { font-size: 26px; font-weight: bold; font-family: 'Brush Script MT', cursive, sans-serif; cursor: pointer; color: var(--text-color); }
    .header-actions { display: flex; gap: 20px; font-size: 21px; align-items: center; }
    .header-actions i { cursor: pointer; position: relative; color: var(--text-color); }

    .verified-tick { color: var(--brand-blue); font-size: 13px; margin-left: 4px; display: inline-flex; align-items: center; }

    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* Stories Bar */
    .stories-scroller { display: flex; gap: 14px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border-color); background: var(--bg-color); }
    .stories-scroller::-webkit-scrollbar { display: none; }
    .story-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; min-width: 66px; }
    .story-ring-wrap { width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); display: flex; align-items: center; justify-content: center; position: relative; }
    .story-ring-wrap.self-empty { background: transparent; border: 1.5px dashed var(--sub-text); }
    .story-thumb-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-color); background: var(--card-bg); }
    .story-add-badge { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: var(--brand-blue); border-radius: 50%; border: 2px solid var(--bg-color); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #fff; }

    /* Mind Bar */
    .whats-on-mind { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; }
    .mind-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .mind-input-faux { flex: 1; background: var(--input-bg); border-radius: 20px; padding: 9px 16px; color: var(--sub-text); font-size: 13px; }

    /* Feed Posts */
    .post-wall { display: flex; flex-direction: column; width: 100%; }
    .post-block { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 4px; background: var(--bg-color); }
    .post-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
    .post-user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .post-user-pfp { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .post-user-text { display: flex; flex-direction: column; }
    .post-author-row { display: flex; align-items: center; gap: 2px; }
    .post-author { font-size: 13px; font-weight: 600; color: var(--text-color); }

    .post-stage { position: relative; width: 100%; aspect-ratio: 1/1; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .post-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .heart-burst { position: absolute; font-size: 85px; color: #ff3040; opacity: 0; transform: scale(0.3); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 10; }
    .heart-burst.pop { opacity: 0.95; transform: scale(1.15); }

    .post-action-bar { display: flex; justify-content: space-between; padding: 10px 14px 6px; font-size: 22px; color: var(--text-color); }
    .post-action-left { display: flex; gap: 18px; }
    .post-action-bar i { cursor: pointer; transition: transform 0.1s ease; }
    .liked-red { color: #ed4956 !important; }
    .saved-gold { color: var(--brand-blue) !important; }

    .post-caption-box { padding: 0 14px; font-size: 13px; line-height: 1.4; color: var(--text-color); }
    .likes-stat { font-weight: 600; margin-bottom: 4px; }
    .caption-content span { font-weight: 600; margin-right: 6px; }

    /* ================= IN-FEED REEL CARD (INSTAGRAM STYLE) ================= */
    .infeed-reel-card { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 8px; background: var(--bg-color); }
    .infeed-reel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
    .infeed-reel-tag { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: #fff; }
    .infeed-reel-tag i { color: #ff2b54; font-size: 15px; }
    
    .infeed-reel-stage { position: relative; width: 100%; aspect-ratio: 9/14; max-height: 520px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .infeed-reel-video { width: 100%; height: 100%; object-fit: cover; }
    
    .infeed-reel-sound-pill { position: absolute; bottom: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; z-index: 15; backdrop-filter: blur(4px); }
    .infeed-reel-bottom-info { position: absolute; bottom: 14px; left: 14px; right: 60px; z-index: 15; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .infeed-reel-author { font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .infeed-reel-caption { font-size: 12.5px; line-height: 1.35; color: #eee; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .infeed-reel-music { font-size: 11px; color: #ccc; display: flex; align-items: center; gap: 5px; margin-top: 4px; }

    /* Fullscreen Reels Tab (For bottom clapperboard icon) */
    #reelsTab { position: relative; height: calc(100vh - 58px); overflow: hidden; background: #000; }
    .reel-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: pan-y; }
    .reel-video-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    .reel-video-element { width: 100%; height: 100%; object-fit: contain; }
    .reel-sidebar-actions { position: absolute; bottom: 20px; right: 14px; display: flex; flex-direction: column; gap: 18px; align-items: center; z-index: 20; color: #fff; }
    .reel-action-bubble { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 25px; cursor: pointer; }
    .reel-action-bubble span { font-size: 12px; font-weight: 500; }

    /* Explore Tab */
    .explore-search-wrap { padding: 12px 14px; }
    .explore-search-input { width: 100%; background: var(--input-bg); border: none; border-radius: 8px; padding: 10px 14px; color: var(--text-color); outline: none; font-size: 14px; }
    .explore-grid-wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .explore-grid-wall img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; background: #111; }

    /* Profile Tab */
    .profile-canvas { padding: 18px 16px; }
    .profile-top-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .profile-username-tag { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    
    .profile-bio-header { display: flex; align-items: center; justify-content: space-between; }
    .profile-hero-pic-wrap { position: relative; width: 84px; height: 84px; cursor: pointer; }
    .profile-hero-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--border-color); background: var(--card-bg); }
    .profile-camera-badge { position: absolute; bottom: 2px; right: 2px; background: var(--brand-blue); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 2px solid var(--bg-color); color: #fff; }
    .profile-metrics-deck { display: flex; gap: 22px; text-align: center; }
    .profile-metrics-deck strong { display: block; font-size: 16px; color: var(--text-color); }
    .profile-metrics-deck span { font-size: 12px; color: var(--sub-text); }
    .profile-bio-textblock { margin-top: 14px; }
    .profile-name-row { display: flex; align-items: center; gap: 6px; }
    .profile-name-row h4 { font-size: 15px; font-weight: 700; color: var(--text-color); }
    .profile-bio-textblock p { font-size: 13px; color: var(--sub-text); margin-top: 2px; }
    
    .profile-action-btns-row { display: flex; gap: 8px; margin-top: 14px; margin-bottom: 14px; }
    .profile-control-btn { flex: 1; padding: 8px; background: var(--hover-bg); color: var(--text-color); font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }

    /* Highlights Section */
    .highlights-scroller { display: flex; gap: 14px; overflow-x: auto; padding: 8px 0 14px; border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
    .highlights-scroller::-webkit-scrollbar { display: none; }
    .highlight-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; min-width: 60px; }
    .highlight-circle { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--border-color); padding: 2px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); }
    .highlight-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .profile-grid-wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 12px; }
    .profile-grid-wall img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; background: #111; }

    /* Bottom Navigation Dock */
    nav.bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background: var(--bg-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 95; max-width: 480px; margin: 0 auto; }
    nav.bottom-dock i { font-size: 21px; color: var(--text-color); cursor: pointer; }
    .profile-dock-icon { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--text-color); object-fit: cover; cursor: pointer; }

    /* Modals */
    .modal-overlay-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal-sheet-inner { background: var(--card-sub-bg); color: var(--text-color); width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; position: relative; border: 1px solid var(--border-color); }
    .modal-sheet-inner h3 { margin-bottom: 14px; font-size: 16px; }
    .modal-sheet-inner input, .modal-sheet-inner textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; margin-bottom: 12px; outline: none; font-size: 13px; }
    .btn-theme-blue { width: 100%; padding: 10px; background: var(--brand-blue); color: #fff; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .close-sheet-icon { position: absolute; top: 16px; right: 16px; font-size: 18px; cursor: pointer; color: var(--sub-text); }
  </style>
</head>
<body>

<div class="app-root">

  <!-- TAB 4: PROFILE -->

<script>
// ==================== INDEXEDDB FOR BULLETPROOF MEDIA ====================
let db;
const DB_NAME = "PicFlowFeedReelsDB_v31";
const STORE_NAME = "posts_store";

function initDB(callback) {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      db.createObjectStore(STORE_NAME, { keyPath: "id" });
    }
  };
  req.onsuccess = function(e) {
    db = e.target.result;
    callback();
  };
  req.onerror = function() { callback(); };
}

function savePostToDB(postObj, callback) {
  if (!db) return callback();
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).put(postObj);
  tx.oncomplete = () => callback();
  tx.onerror = () => callback();
}

function getAllPostsFromDB(callback) {
  if (!db) return callback([]);
  const tx = db.transaction([STORE_NAME], "readonly");
  const req = tx.objectStore(STORE_NAME).getAll();
  req.onsuccess = () => callback(req.result || []);
  req.onerror = () => callback([]);
}

// ==================== PERMANENT STATE ====================
const SAVED_PERMANENT_DP = localStorage.getItem("pf_permanent_dp") || "https://picsum.photos/200/200?random=1";
const SAVED_PERMANENT_USERNAME = localStorage.getItem("pf_permanent_username") || "Subbhubhai.official";

let userProfile = {
  name: SAVED_PERMANENT_USERNAME,
  bio: SAVED_PERMANENT_BIO,
  avatar: SAVED_PERMANENT_DP,
  followers: "500M",
  isVerified: true
};

// Seed Feed Post
const SEED_DEFAULT_POST = {
  id: 101,
  type: "photo",
  username: userProfile.name,
  avatar: userProfile.avatar,
  image: "https://picsum.photos/800/800?random=181",
  caption: "Official Verified Creator Vibes ⚡💙",
  likes: 1284,
  liked: false
};

// In-Feed Official Reel Card
const INFEED_REEL_CARD = {
  id: "reel_infeed_1",
  type: "reel",
  user: "ezybeacar",
  avatar: "https://picsum.photos/100/100?random=10",
  video: "https://assets.mixkit.co/videos/preview/mixkit-driving-through-the-streets-of-a-modern-city-at-night-42284-large.mp4",
  caption: "Desert off-roading SUV test 🚙💨 挣很多钱 去很多地方....",
  music: "UMPSTYLE (Slowed) TV • Original Audio",
  likes: "28K",
  comments: "46",
  liked: true
};

let globalPosts = [];

const REEL_DATABASE = [
  INFEED_REEL_CARD,
  {
    id: "reel_2",
    type: "reel",
    user: "Subbhubhai.official",
    avatar: userProfile.avatar,
    video: "https://assets.mixkit.co/videos/preview/mixkit-vertical-view-of-waves-coming-to-the-shore-41586-large.mp4",
    caption: "Sunset ocean waves 🌊✨ Sound on!",
    music: "Apna Bana Le - Arijit Singh",
    likes: "45.2k",
    comments: "312",
    liked: false
  }
];

let stories = [
  { id: 1, user: "Your story", avatar: userProfile.avatar, img: "https://picsum.photos/800/1200?random=191" },
  { id: 2, user: "neha_v", avatar: "https://picsum.photos/200/200?random=3", img: "https://picsum.photos/800/1200?random=192" },
  { id: 3, user: "rahul_k", avatar: "https://picsum.photos/200/200?random=4", img: "https://picsum.photos/800/1200?random=193" }
];

// Switch Tabs
function switchView(viewId) {
  document.querySelectorAll(".tab-section").forEach(sec => sec.classList.remove("active"));
  const el = document.getElementById(viewId);
  if (el) el.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (viewId === "exploreTab") renderExploreGrid();
  if (viewId === "profileTab") renderProfileSection();

  // Fullscreen reel control
  const fsVideo = document.getElementById("fullscreenReelVideo");
  if (viewId === "reelsTab") {
    fsVideo.play().catch(() => {});
  } else {
    fsVideo.pause();
  }
}

// Stories Tray
function renderStories() {
  const container = document.getElementById("storiesTray");
  if (!container) return;
  container.innerHTML = `
    <div class="story-slot" onclick="alert('Create Story')">
      <div class="story-ring-wrap self-empty">
        <img class="story-thumb-img" src="${userProfile.avatar}" />
        <div class="story-add-badge">+</div>
      </div>
      <span>Your story</span>
    </div>
  ` + stories.map(s => `
    <div class="story-slot" onclick="alert('Viewing story of ${s.user}')">
      <div class="story-ring-wrap">
        <img class="story-thumb-img" src="${s.avatar}" />
      </div>
      <span>${s.user}</span>
    </div>
  `).join("");
}

// ==================== FEED (POSTS + IN-FEED REELS) ====================
function renderFeed() {
  const wall = document.getElementById("postsContainer");
  if (!wall) return;

  // Insert In-Feed Reel Card directly after top posts
  let feedList = [...globalPosts];
  if (!feedList.length) feedList = [SEED_DEFAULT_POST];
  
  // Inject In-Feed Reel smoothly at position 1
  feedList.splice(1, 0, INFEED_REEL_CARD);

  wall.innerHTML = feedList.map(item => {
    if (item.type === "reel") {
      // IN-FEED REEL CARD
      return `
        <article class="infeed-reel-card" id="card-${item.id}">
          <div class="infeed-reel-header">
            <div class="infeed-reel-tag">
              <i class="fa-solid fa-clapperboard"></i>
              <span>Reels</span>
            </div>
            <i class="fa-solid fa-ellipsis" style="color:var(--sub-text); cursor:pointer;"></i>
          </div>

          <div class="infeed-reel-stage" onclick="toggleInfeedReelAudio('infeed-video-${item.id}')">
            <video class="infeed-reel-video" id="infeed-video-${item.id}" src="${item.video}" playsinline loop autoplay muted></video>
            
            <div class="infeed-reel-sound-pill" id="sound-pill-${item.id}">
              <i class="fa-solid fa-volume-xmark" id="sound-icon-${item.id}"></i>
            </div>

            <div class="infeed-reel-bottom-info">
              <div class="infeed-reel-author">
                <img src="${item.avatar}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;" />
                <span>${item.user}</span>
                <i class="fa-solid fa-circle-check verified-tick" style="font-size:11px;"></i>
              </div>
              <p class="infeed-reel-caption">${item.caption}</p>
              <div class="infeed-reel-music"><i class="fa-solid fa-music"></i> ${item.music}</div>
            </div>
          </div>

          <div class="post-action-bar">
            <div class="post-action-left">
              <i class="fa-solid fa-heart liked-red" onclick="this.classList.toggle('liked-red')"></i>
              <i class="fa-regular fa-comment" onclick="alert('Reel comments: 46')"></i>
              <i class="fa-regular fa-paper-plane" onclick="sharePost()"></i>
            </div>
            <i class="fa-regular fa-bookmark" onclick="this.classList.toggle('fa-solid')"></i>
          </div>

          <div class="post-caption-box">
            <div class="likes-stat">${item.likes} likes</div>
          </div>
        </article>
      `;
    } else {
      // REGULAR PHOTO POST
      return `
        <article class="post-block" id="post-${item.id}">
          <div class="post-top">
            <div class="post-user-info" onclick="switchView('profileTab')">
              <img src="${item.avatar}" class="post-user-pfp" />
              <div class="post-user-text">
                <div class="post-author-row">
                  <span class="post-author">${item.username}</span>
                  <i class="fa-solid fa-circle-check verified-tick"></i>
                </div>
              </div>
            </div>
            <i class="fa-solid fa-ellipsis" style="color:var(--sub-text); cursor:pointer;"></i>
          </div>

          <div class="post-stage" ondblclick="fireDoubleTapHeart(${item.id})">
            <img src="${item.image}" loading="lazy" />
            <i class="fa-solid fa-heart heart-burst" id="burst-${item.id}"></i>
          </div>

          <div class="post-action-bar">
            <div class="post-action-left">
              <i class="${item.liked ? 'fa-solid fa-heart liked-red' : 'fa-regular fa-heart'}" onclick="togglePostLike(${item.id})"></i>
              <i class="fa-regular fa-comment" onclick="alert('Comment added!')"></i>
              <i class="fa-regular fa-paper-plane" onclick="sharePost()"></i>
            </div>
            <i class="fa-regular fa-bookmark" onclick="this.classList.toggle('fa-solid')"></i>
          </div>

          <div class="post-caption-box">
            <div class="likes-stat">${item.likes || 1} likes</div>
            <div class="caption-content"><span>${item.username}</span>${item.caption || ''}</div>
          </div>
        </article>
      `;
    }
  }).join("");
}

function toggleInfeedReelAudio(videoId) {
  const vid = document.getElementById(videoId);
  if (!vid) return;
  vid.muted = !vid.muted;
  const icon = document.querySelector(`#${videoId.replace('infeed-video-', 'sound-icon-')}`);
  if (icon) {
    icon.className = vid.muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
  }
}

function togglePostLike(id) {
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  p.liked = !p.liked;
  p.likes = (p.likes || 1) + (p.liked ? 1 : -1);
  savePostToDB(p, () => {});
  renderFeed();
}

function fireDoubleTapHeart(id) {
  const burst = document.getElementById(`burst-${id}`);
  if (burst) {
    burst.classList.add("pop");
    setTimeout(() => burst.classList.remove("pop"), 500);
  }
  const p = globalPosts.find(item => item.id === id) || SEED_DEFAULT_POST;
  if (!p.liked) {
    p.liked = true;
    p.likes = (p.likes || 0) + 1;
    savePostToDB(p, () => {});
    renderFeed();
  }
}

function sharePost() {
  if (navigator.share) {
    navigator.share({ title: 'PicFlow', url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Link copied to clipboard! 🔗");
  }
}

// ==================== FULLSCREEN REELS TAB CONTROLLERS ====================
let fullscreenIndex = 0;
const fsVideoEl = document.getElementById("fullscreenReelVideo");

function mountFullscreenReel(idx) {
  const data = REEL_DATABASE[idx];
  fsVideoEl.src = data.video;
  fsVideoEl.muted = false;
  document.getElementById("fullscreenLikeIcon").className = data.liked ? "fa-solid fa-heart liked-red" : "fa-solid fa-heart";
  fsVideoEl.play().catch(() => {});
}

function handleFullscreenReelTap() {
  if (fsVideoEl.paused) fsVideoEl.play();
  else fsVideoEl.pause();
}

function handleFullscreenReelDoubleTap() {
  const burst = document.getElementById("fullscreenBurstHeart");
  burst.classList.add("pop");
  setTimeout(() => burst.classList.remove("pop"), 500);
  document.getElementById("fullscreenLikeIcon").className = "fa-solid fa-heart liked-red";
}

function toggleFullscreenLike() {
  const icon = document.getElementById("fullscreenLikeIcon");
  icon.classList.toggle("liked-red");
}

function advanceFullscreenReel(step) {
  fullscreenIndex = (fullscreenIndex + step + REEL_DATABASE.length) % REEL_DATABASE.length;
  mountFullscreenReel(fullscreenIndex);
}

// ==================== PROFILE & UPLOAD ====================
function renderProfileSection() {
  document.getElementById("profileHeroName").innerText = userProfile.name;
  document.getElementById("profileTopUsername").innerText = userProfile.name;
  document.getElementById("profileHeroBio").innerText = userProfile.bio;
  document.getElementById("profileHeroPic").src = userProfile.avatar;
  document.getElementById("profileDockAvatar").src = userProfile.avatar;
  document.getElementById("mindBarAvatar").src = userProfile.avatar;

  const displayList = globalPosts.length ? globalPosts : [SEED_DEFAULT_POST];
  document.getElementById("profilePostCountNumber").innerText = displayList.length;

  const grid = document.getElementById("profileGridWall");
  if (grid) {
    grid.innerHTML = displayList.map(p => `<img src="${p.image}" onclick="switchView('feedTab')" />`).join("");
  }
}

function openCreatePostSheet() { document.getElementById("createPostModal").style.display = "flex"; }
function closeCreatePostSheet() { document.getElementById("createPostModal").style.display = "none"; }

function dispatchNewPost() {
  const fileInput = document.getElementById("postImageUploadInput");
  const file = fileInput.files[0];
  const captionInput = document.getElementById("postCaptionTextInput");
  const btn = document.getElementById("btnPublishPost");

  if (!file) {
    alert("Please choose an image!");
    return;
  }

  btn.innerText = "Sharing...";
  btn.disabled = true;

  const reader = new FileReader();
  reader.onload = function(e) {
    const newPost = {
      id: Date.now(),
      type: "photo",
      username: userProfile.name,
      avatar: userProfile.avatar,
      image: e.target.result,
      caption: captionInput.value || "",
      likes: 0,
      liked: false
    };

    savePostToDB(newPost, function() {
      globalPosts.unshift(newPost);
      renderFeed();
      renderProfileSection();

      closeCreatePostSheet();
      btn.innerText = "Share Post";
      btn.disabled = false;
      fileInput.value = "";
      captionInput.value = "";

      switchView("feedTab");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  };
  reader.readAsDataURL(file);
}

function openProfileEditSheet() {
  document.getElementById("editProfileDisplayName").value = userProfile.name;
  document.getElementById("editProfileBioDetails").value = userProfile.bio;
  document.getElementById("editProfileModal").style.display = "flex";
}
function closeProfileEditSheet() { document.getElementById("editProfileModal").style.display = "none"; }

function saveProfileDetails() {
  const name = document.getElementById("editProfileDisplayName").value.trim();
  const bio = document.getElementById("editProfileBioDetails").value.trim();
  const picFile = document.getElementById("editProfilePicFile").files[0];

  if (name) userProfile.name = name;
  if (bio) userProfile.bio = bio;

  localStorage.setItem("pf_permanent_username", userProfile.name);
  localStorage.setItem("pf_permanent_bio", userProfile.bio);

  if (picFile) {
    const reader = new FileReader();
    reader.onload = function(e) {
      userProfile.avatar = e.target.result;
      localStorage.setItem("pf_permanent_dp", userProfile.avatar);
      renderProfileSection();
      renderFeed();
      closeProfileEditSheet();
      alert("Profile permanently saved! 💙");
    };
    reader.readAsDataURL(picFile);
  } else {
    renderProfileSection();
    renderFeed();
    closeProfileEditSheet();
    alert("Profile permanently saved! 💙");
  }
}

function quickChangeDP() { document.getElementById("directDpFileInput").click(); }

function handleDirectDP(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    userProfile.avatar = e.target.result;
    localStorage.setItem("pf_permanent_dp", userProfile.avatar);
    renderProfileSection();
    renderFeed();
    alert("DP updated! 📸");
  };
  reader.readAsDataURL(file);
}

// Explore Grid
const EXPLORE_PHOTOS = [
  "https://picsum.photos/400/400?random=11",
  "https://picsum.photos/400/400?random=12",
  "https://picsum.photos/400/400?random=13",
  "https://picsum.photos/400/400?random=14",
  "https://picsum.photos/400/400?random=15",
  "https://picsum.photos/400/400?random=16"
];

function renderExploreGrid() {
  const wall = document.getElementById("exploreGridWall");
  if (!wall) return;
  wall.innerHTML = EXPLORE_PHOTOS.map(url => `<img src="${url}" onclick="alert('Photo view!')" />`).join("");
}

function handleExploreSearch(q) {
  const wall = document.getElementById("exploreGridWall");
  if (!q) { renderExploreGrid(); return; }
  wall.innerHTML = EXPLORE_PHOTOS.slice(0, 3).map(url => `<img src="${url}" />`).join("");
}

// ==================== INITIAL BOOT ====================
window.addEventListener("DOMContentLoaded", () => {
  renderProfileSection();
  renderStories();
  initDB(function() {
    getAllPostsFromDB(function(savedPosts) {
      if (savedPosts && savedPosts.length) {
        globalPosts = savedPosts.sort((a, b) => b.id - a.id);
      }
      renderFeed();
      renderProfileSection();
    });
  });
  mountFullscreenReel(0);
});
</script>
