<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PicFlow</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
img,video{max-width:100%;display:block}

body{min-height:100vh}
#app{max-width:620px;margin:auto;min-height:100vh;background:#000}

.screen{min-height:100vh}
.hidden{display:none!important}

.auth{
 min-height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 padding:25px;
 background:linear-gradient(160deg,#000,#101010,#000)
}

.logo{
 font-size:42px;
 font-weight:900;
 text-align:center;
 margin-bottom:35px;
 letter-spacing:-2px
}

.auth-box{
 width:100%;
 max-width:390px;
 margin:auto
}

.field{
 width:100%;
 background:#171717;
 border:1px solid #333;
 color:#fff;
 border-radius:10px;
 padding:14px;
 margin:7px 0;
 outline:none
}

.field:focus{border-color:#777}

.primary{
 width:100%;
 border:0;
 border-radius:10px;
 padding:14px;
 margin-top:10px;
 background:#fff;
 color:#000;
 font-weight:800
}

.secondary{
 width:100%;
 border:1px solid #333;
 border-radius:10px;
 padding:13px;
 margin-top:10px;
 background:#111;
 color:#fff
}

.auth-link{
 text-align:center;
 margin:18px 0;
 color:#aaa;
 cursor:pointer
}

.top{
 position:sticky;
 top:0;
 z-index:20;
 height:58px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 border-bottom:1px solid #222;
 background:rgba(0,0,0,.94);
 backdrop-filter:blur(15px)
}

.brand{font-size:25px;font-weight:900}
.top-actions{display:flex;gap:16px;font-size:22px}

.page{padding-bottom:70px}

.stories{
 display:flex;
 gap:14px;
 overflow-x:auto;
 padding:14px;
 border-bottom:1px solid #222
}
.stories::-webkit-scrollbar{display:none}

.story{
 min-width:66px;
 text-align:center;
 font-size:11px;
 color:#aaa
}
.story-ring{
 width:58px;
 height:58px;
 border-radius:50%;
 padding:2px;
 background:linear-gradient(45deg,#ffdd00,#ff0066,#8b00ff);
 margin:auto
}
.story-ring img{
 width:100%;
 height:100%;
 object-fit:cover;
 border-radius:50%;
 border:3px solid #000
}

.create-box{
 margin:12px;
 padding:12px;
 border:1px solid #222;
 border-radius:12px;
 display:flex;
 align-items:center;
 gap:12px
}

.avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 object-fit:cover;
 background:#222
}

.create-input{
 flex:1;
 background:#151515;
 border:0;
 color:#aaa;
 border-radius:22px;
 padding:11px 15px
}

.post{
 border-bottom:1px solid #222;
 margin-bottom:8px
}

.post-head{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px
}

.post-user{
 font-weight:800;
 flex:1
}

.more{font-size:22px}

.post-media{
 width:100%;
 max-height:650px;
 object-fit:cover;
 background:#111
}

.post-actions{
 display:flex;
 align-items:center;
 gap:18px;
 padding:11px 13px 5px;
 font-size:25px
}

.action{
 cursor:pointer;
 user-select:none
}

.post-info{padding:0 13px 14px}
.likes{font-weight:800;margin-bottom:7px}
.caption{line-height:1.35}
.comments-link{color:#888;margin-top:7px;cursor:pointer}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:620px;
 height:62px;
 background:rgba(0,0,0,.96);
 border-top:1px solid #222;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:50
}

.nav{
 font-size:24px;
 opacity:.75;
 cursor:pointer;
 text-align:center
}
.nav.active{opacity:1}
.nav small{display:block;font-size:9px}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 z-index:100;
 display:flex;
 align-items:flex-end;
 justify-content:center
}

.sheet{
 width:100%;
 max-width:620px;
 max-height:90vh;
 overflow:auto;
 background:#111;
 border-radius:22px 22px 0 0;
 padding:18px
}

.close{
 float:right;
 border:0;
 background:#222;
 color:#fff;
 border-radius:50%;
 width:35px;
 height:35px
}

.modal-title{
 font-size:22px;
 font-weight:900;
 margin:5px 0 20px
}

.profile-head{
 display:flex;
 gap:20px;
 align-items:center;
 padding:15px 0
}

.profile-avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 object-fit:cover;
 background:#222
}

.profile-stats{
 display:flex;
 gap:22px;
 text-align:center
}
.profile-stats b{display:block;font-size:18px}
.profile-stats span{font-size:11px;color:#999}

.profile-name{font-size:20px;font-weight:900}
.profile-bio{color:#bbb;margin:5px 0 15px}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:2px;
 margin-top:15px
}
.grid img,.grid video{
 width:100%;
 aspect-ratio:1;
 object-fit:cover
}

.search{
 width:100%;
 background:#1a1a1a;
 border:0;
 border-radius:12px;
 padding:14px;
 color:#fff;
 margin-bottom:15px
}

.person{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px 0;
 border-bottom:1px solid #222
}

.person-info{flex:1}
.person-info b{display:block}
.person-info span{font-size:12px;color:#888}

.follow-btn{
 border:0;
 background:#fff;
 color:#000;
 border-radius:8px;
 padding:8px 15px;
 font-weight:800
}
.following-btn{
 background:#222;
 color:#fff;
 border:1px solid #444
}

.tabs{
 display:flex;
 border-bottom:1px solid #222;
 margin-bottom:10px
}
.tab{
 flex:1;
 text-align:center;
 padding:13px;
 color:#777
}
.tab.active{color:#fff;border-bottom:2px solid #fff}

.setting{
 padding:16px 5px;
 border-bottom:1px solid #222;
 display:flex;
 justify-content:space-between
}

.empty{
 padding:50px 20px;
 text-align:center;
 color:#777
}

.toast{
 position:fixed;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 background:#fff;
 color:#000;
 padding:11px 18px;
 border-radius:25px;
 z-index:999;
 font-weight:700
}

.comment{
 padding:10px 0;
 border-bottom:1px solid #222
}
.comment b{margin-right:5px}

textarea.field{min-height:100px;resize:none}

.preview{
 max-height:300px;
 margin:10px auto;
 border-radius:12px
}

@media(max-width:620px){
 .top{height:55px}
 .post-media{max-height:none}
}
</style>
</head>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=master202609"></script>

<script>
const SB=window.supabase.createClient(
 window.SUPABASE_URL,
 window.SUPABASE_PUBLISHABLE_KEY
);

let user=null;
let profile=null;
let feed=[];
let currentPage="home";

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function avatar(url,name){
 return url || "https://ui-avatars.com/api/?name="+encodeURIComponent(name||"P")+"&background=222&color=fff";
}

function toast(msg){
 const x=document.createElement("div");
 x.className="toast";
 x.textContent=msg;
 document.body.appendChild(x);
 setTimeout(()=>x.remove(),2200);
}

async function getUser(){
 const {data}=await SB.auth.getUser();
 return data.user;
}

async function loadProfile(){
 if(!user)return;
 const {data,error}=await SB.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error)console.error(error);
 profile=data||{
  id:user.id,
  username:user.user_metadata?.username||user.email?.split("@")[0]||"user",
  bio:"",
  avatar_url:""
 };
}

function authScreen(){
 $("app").innerHTML=`
 <div class="auth">
  <div class="auth-box">
   <div class="logo">PicFlow</div>

   <input id="loginEmail" class="field" placeholder="Email">
   <input id="loginPassword" type="password" class="field" placeholder="Password">

   <button class="primary" onclick="login()">Log in</button>

   <div class="auth-link" onclick="forgot()">Forgot password?</div>

   <button class="secondary" onclick="signupScreen()">Create new account</button>
  </div>
 </div>`;
}

function signupScreen(){
 $("app").innerHTML=`
 <div class="auth">
  <div class="auth-box">
   <div class="logo">PicFlow</div>

   <input id="suName" class="field" placeholder="Username">
   <input id="suEmail" class="field" placeholder="Email">
   <input id="suMobile" class="field" placeholder="Mobile Number">
   <input id="suPass" type="password" class="field" placeholder="Password">
   <input id="suPass2" type="password" class="field" placeholder="Confirm Password">

   <button class="primary" onclick="signup()">Create Account</button>
   <button class="secondary" onclick="authScreen()">Back to Login</button>
  </div>
 </div>`;
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password)return toast("Email and password required");

 const {error}=await SB.auth.signInWithPassword({email,password});

 if(error)return toast(error.message);

 user=await getUser();
 await loadProfile();
 render();
}

async function signup(){
 const username=$("suName").value.trim();
 const email=$("suEmail").value.trim();
 const mobile=$("suMobile").value.trim();
 const password=$("suPass").value;
 const password2=$("suPass2").value;

 if(!username||!email||!mobile||!password)return toast("All fields required");
 if(password!==password2)return toast("Passwords do not match");
 if(password.length<6)return toast("Password minimum 6 characters");

 const {data,error}=await SB.auth.signUp({
  email,
  password,
  options:{
   data:{username,mobile}
  }
 });

 if(error)return toast(error.message);

 if(data.session){
  user=data.user;
  await loadProfile();
  toast("Account created 🎉");
  render();
 }else{
  toast("Check your email to confirm account");
  authScreen();
 }
}

async function forgot(){
 const email=prompt("Enter your email");
 if(!email)return;

 const {error}=await SB.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });

 if(error)return toast(error.message);
 toast("Password reset email sent");
}

async function logout(){
 await SB.auth.signOut();
 user=null;
 profile=null;
 authScreen();
}

function shell(){
 $("app").innerHTML=`
 <div class="screen">
  <div class="top">
   <div class="brand">PicFlow</div>
   <div class="top-actions">
    <span onclick="openSearch()">⌕</span>
    <span onclick="openNotifications()">♡</span>
    <span onclick="openMessages()">✈</span>
   </div>
  </div>

  <div id="page" class="page"></div>

  <div class="bottom">
   <div class="nav active" onclick="go('home')">⌂<small>Home</small></div>
   <div class="nav" onclick="openSearch()">⌕<small>Search</small></div>
   <div class="nav" onclick="openCreate()">＋<small>Create</small></div>
   <div class="nav" onclick="go('reels')">▶<small>Reels</small></div>
   <div class="nav" onclick="openProfile(user.id)">◉<small>Profile</small></div>
  </div>
 </div>`;
}

async function render(){
 if(!user)return authScreen();
 shell();
 await home();
}

async function home(){
 currentPage="home";

 const page=$("page");

 page.innerHTML=`
 <div class="stories" id="stories">
  <div class="story" onclick="openCreate()">
   <div class="story-ring">
    <img src="${avatar(profile?.avatar_url,profile?.username)}">
   </div>
   Your story
  </div>
 </div>

 <div class="create-box">
  <img class="avatar" src="${avatar(profile?.avatar_url,profile?.username)}">
  <div class="create-input" onclick="openCreate()">What's on your mind?</div>
  <button onclick="openCreate()" style="background:none;border:0;color:#fff;font-size:22px">📷</button>
 </div>

 <div id="feed"><div class="empty">Loading feed...</div></div>`;

 await loadStories();
 await loadFeed();
}

async function loadStories(){
 const {data}=await SB.from("stories")
 .select("*,profiles(username,avatar_url)")
 .order("created_at",{ascending:false})
 .limit(20);

 const box=$("stories");
 if(!box)return;

 (data||[]).forEach(s=>{
  const name=s.profiles?.username||"user";
  box.insertAdjacentHTML("beforeend",`
   <div class="story" onclick="viewStory('${esc(s.media_url)}')">
    <div class="story-ring">
     <img src="${avatar(s.profiles?.avatar_url,name)}">
    </div>
    ${esc(name)}
   </div>`);
 });
}

async function loadFeed(){
 const box=$("feed");
 if(!box)return;

 const {data,error}=await SB.from("posts")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(50);

 if(error){
  console.error(error);
  box.innerHTML='<div class="empty">Create your first post 🚀</div>';
  return;
 }

 feed=data||[];

 if(!feed.length){
  box.innerHTML='<div class="empty">No posts yet.<br><br>Create your first post 🚀</div>';
  return;
 }

 box.innerHTML="";

 for(const p of feed){
  const {data:pr}=await SB.from("profiles")
   .select("username,avatar_url")
   .eq("id",p.user_id)
   .maybeSingle();

  const {count:lc}=await SB.from("likes")
   .select("*",{count:"exact",head:true})
   .eq("post_id",p.id);

  const {data:myLike}=await SB.from("likes")
   .select("post_id")
   .eq("post_id",p.id)
   .eq("user_id",user.id)
   .maybeSingle();

  const {count:cc}=await SB.from("comments")
   .select("*",{count:"exact",head:true})
   .eq("post_id",p.id);

  const {data:sv}=await SB.from("saved_posts")
   .select("post_id")
   .eq("post_id",p.id)
   .eq("user_id",user.id)
   .maybeSingle();

  box.insertAdjacentHTML("beforeend",postHTML(
   p,
   pr||{},
   lc||0,
   !!myLike,
   cc||0,
   !!sv
  ));
 }
}

function postHTML(p,pr,likes,liked,comments,saved){
 const media=p.media_type==="video"
  ? `<video class="post-media" src="${esc(p.media_url)}" controls playsinline></video>`
  : `<img class="post-media" src="${esc(p.media_url)}" loading="lazy">`;

 return `
 <article class="post" data-id="${p.id}">
  <div class="post-head">
   <img class="avatar" src="${avatar(pr.avatar_url,pr.username)}"
        onclick="openProfile('${p.user_id}')">
   <div class="post-user" onclick="openProfile('${p.user_id}')">
    ${esc(pr.username||"user")}
   </div>
   <div class="more">•••</div>
  </div>

  ${media}

  <div class="post-actions">
   <span class="action" onclick="likePost('${p.id}',this)">
    ${liked?"❤️":"♡"}
   </span>
   <span class="action" onclick="comments('${p.id}')">💬</span>
   <span class="action" onclick="sharePost('${p.id}')">➤</span>
   <span class="action" onclick="savePost('${p.id}',this)" style="margin-left:auto">
    ${saved?"🔖":"🔖"}
   </span>
  </div>

  <div class="post-info">
   <div class="likes">${likes} likes</div>
   <div class="caption">
    <b>${esc(pr.username||"user")}</b>
    ${esc(p.caption||"")}
   </div>
   <div class="comments-link" onclick="comments('${p.id}')">
    View all ${comments} comments
   </div>
  </div>
 </article>`;
}

async function openCreate(){
 showModal(`
 <div class="modal-title">Create Post</div>

 <input id="postFile" type="file" accept="image/*,video/*" class="field"
 onchange="previewPost(event)">

 <img id="postPreview" class="preview hidden">

 <textarea id="postCaption" class="field"
 placeholder="Write a caption..."></textarea>

 <button class="primary" onclick="createPost()">Share</button>
 `);
}

function previewPost(e){
 const file=e.target.files[0];
 if(!file)return;

 const img=$("postPreview");

 if(file.type.startsWith("video")){
  img.outerHTML='<video id="postPreview" class="preview" controls></video>';
  $("postPreview").src=URL.createObjectURL(file);
 }else{
  img.src=URL.createObjectURL(file);
  img.classList.remove("hidden");
 }
}

async function createPost(){
 const input=$("postFile");
 const file=input?.files?.[0];
 const caption=$("postCaption")?.value?.trim()||"";

 if(!file)return toast("Choose image/video");

 if(file.size>50*1024*1024)
  return toast("Maximum 50MB");

 const ext=file.name.split(".").pop().toLowerCase();
 const path=user.id+"/"+Date.now()+"."+ext;

 toast("Uploading...");

 const {error:up}=await SB.storage.from("posts")
 .upload(path,file,{
  upsert:false,
  contentType:file.type,
  cacheControl:"3600"
 });

 if(up)return toast(up.message);

 const {data:urlData}=SB.storage.from("posts").getPublicUrl(path);

 const {error}=await SB.from("posts").insert({
  user_id:user.id,
  media_url:urlData.publicUrl,
  media_type:file.type.startsWith("video")?"video":"image",
  caption
 });

 if(error)return toast(error.message);

 closeModal();
 toast("Posted successfully 🎉");
 await home();
}

async function likePost(id,el){
 const {data:existing}=await SB.from("likes")
 .select("post_id")
 .eq("post_id",id)
 .eq("user_id",user.id)
 .maybeSingle();

 if(existing){
  await SB.from("likes").delete()
   .eq("post_id",id).eq("user_id",user.id);
  el.textContent="♡";
 }else{
  await SB.from("likes").insert({
   post_id:id,
   user_id:user.id
  });
  el.textContent="❤️";
 }

 const {count}=await SB.from("likes")
 .select("*",{count:"exact",head:true})
 .eq("post_id",id);

 const post=el.closest(".post");
 post.querySelector(".likes").textContent=(count||0)+" likes";
}

async function savePost(id,el){
 const {data:existing}=await SB.from("saved_posts")
 .select("post_id")
 .eq("post_id",id)
 .eq("user_id",user.id)
 .maybeSingle();

 if(existing){
  await SB.from("saved_posts").delete()
   .eq("post_id",id).eq("user_id",user.id);
  toast("Removed from Saved");
 }else{
  await SB.from("saved_posts").insert({
   post_id:id,
   user_id:user.id
  });
  toast("Saved 🔖");
 }
}

async function comments(id){
 const {data:rows,error}=await SB.from("comments")
 .select("*")
 .eq("post_id",id)
 .order("created_at",{ascending:true});

 if(error)return toast(error.message);

 let html=`
 <div class="modal-title">Comments</div>
 <div id="commentList">`;

 for(const c of rows||[]){
  const {data:p}=await SB.from("profiles")
   .select("username")
   .eq("id",c.user_id)
   .maybeSingle();

  html+=`
   <div class="comment">
    <b>${esc(p?.username||"user")}</b>${esc(c.body)}
   </div>`;
 }

 html+=`
 </div>
 <textarea id="commentText" class="field" placeholder="Add a comment..."></textarea>
 <button class="primary" onclick="addComment('${id}')">Post comment</button>`;

 showModal(html);
}

async function addComment(id){
 const body=$("commentText").value.trim();
 if(!body)return;

 const {error}=await SB.from("comments").insert({
  post_id:id,
  user_id:user.id,
  body
 });

 if(error)return toast(error.message);

 toast("Comment added 💬");
 comments(id);
}

async function sharePost(id){
 const url=location.origin+location.pathname+"?post="+id;

 if(navigator.share){
  try{
   await navigator.share({title:"PicFlow",url});
  }catch(e){}
 }else{
  await navigator.clipboard?.writeText(url);
  toast("Post link copied");
 }
}

async function openProfile(uid){
 const {data:p}=await SB.from("profiles")
 .select("*").eq("id",uid).maybeSingle();

 if(!p)return toast("Profile not found");

 const {count:followers}=await SB.from("follows")
 .select("*",{count:"exact",head:true})
 .eq("following_id",uid);

 const {count:following}=await SB.from("follows")
 .select("*",{count:"exact",head:true})
 .eq("follower_id",uid);

 const {data:posts}=await SB.from("posts")
 .select("*")
 .eq("user_id",uid)
 .order("created_at",{ascending:false});

 let followBtn="";

 if(uid!==user.id){
  const {data:f}=await SB.from("follows")
   .select("*")
   .eq("follower_id",user.id)
   .eq("following_id",uid)
   .maybeSingle();

  followBtn=`
   <button class="follow-btn ${f?"following-btn":""}"
    onclick="toggleFollow('${uid}',this)">
    ${f?"Following":"Follow"}
   </button>`;
 }else{
  followBtn=`
   <button class="secondary" onclick="editProfile()">
    ✏️ Edit Profile
   </button>`;
 }

 let grid="";

 for(const x of posts||[]){
  grid+=x.media_type==="video"
   ? `<video src="${esc(x.media_url)}" controls></video>`
   : `<img src="${esc(x.media_url)}">`;
 }

 showModal(`
  <div class="modal-title">Profile</div>

  <div class="profile-head">
   <img class="profile-avatar"
    src="${avatar(p.avatar_url,p.username)}">

   <div class="profile-stats">
    <div><b>${posts?.length||0}</b><span>Posts</span></div>
    <div><b>${followers||0}</b><span>Followers</span></div>
    <div><b>${following||0}</b><span>Following</span></div>
   </div>
  </div>

  <div class="profile-name">${esc(p.username)}</div>
  <div class="profile-bio">${esc(p.bio||"")}</div>

  ${followBtn}

  <div class="grid">${grid||"<div class='empty'>No posts</div>"}</div>
 `);
}

async function toggleFollow(uid,btn){
 const {data:f}=await SB.from("follows")
 .select("*")
 .eq("follower_id",user.id)
 .eq("following_id",uid)
 .maybeSingle();

 if(f){
  await SB.from("follows").delete()
   .eq("follower_id",user.id)
   .eq("following_id",uid);

  btn.textContent="Follow";
  btn.classList.remove("following-btn");
 }else{
  await SB.from("follows").insert({
   follower_id:user.id,
   following_id:uid
  });

  btn.textContent="Following";
  btn.classList.add("following-btn");
 }
}

async function editProfile(){
 const {data:p}=await SB.from("profiles")
  .select("*").eq("id",user.id).maybeSingle();

 showModal(`
  <div class="modal-title">Edit Profile</div>

  <img id="editAvatar" class="profile-avatar"
   src="${avatar(p?.avatar_url,p?.username)}"
   style="margin-bottom:15px">

  <input id="avatarFile" class="field" type="file"
   accept="image/*" onchange="changeAvatar(event)">

  <input id="editUsername" class="field"
   value="${esc(p?.username||"")}">

  <textarea id="editBio" class="field"
   placeholder="Bio">${esc(p?.bio||"")}</textarea>

  <button class="primary" onclick="saveProfile()">Save Profile</button>
 `);
}

async function changeAvatar(e){
 const file=e.target.files[0];
 if(!file)return;

 if(file.size>6*1024*1024)
  return toast("DP maximum 6MB");

 const ext=file.name.split(".").pop().toLowerCase();
 const path=user.id+"/"+Date.now()+"."+ext;

 const {error}=await SB.storage.from("avatars")
 .upload(path,file,{
  upsert:false,
  contentType:file.type,
  cacheControl:"3600"
 });

 if(error)return toast(error.message);

 const {data}=SB.storage.from("avatars").getPublicUrl(path);

 await SB.from("profiles").update({
  avatar_url:data.publicUrl,
  updated_at:new Date().toISOString()
 }).eq("id",user.id);

 $("editAvatar").src=data.publicUrl;
 profile.avatar_url=data.publicUrl;
 toast("Profile photo updated 📸");
}

async function saveProfile(){
 const username=$("editUsername").value.trim();
 const bio=$("editBio").value.trim();

 if(!username)return toast("Username required");

 const {error}=await SB.from("profiles").update({
  username,
  bio,
  updated_at:new Date().toISOString()
 }).eq("id",user.id);

 if(error)return toast(error.message);

 profile.username=username;
 profile.bio=bio;

 closeModal();
 toast("Profile saved ✅");
}

async function openSearch(){
 showModal(`
  <div class="modal-title">Search</div>
  <input id="searchInput" class="search"
   placeholder="Search username..."
   oninput="searchUsers()">
  <div id="searchResults"></div>
 `);
}

let searchTimer;
async function searchUsers(){
 clearTimeout(searchTimer);

 searchTimer=setTimeout(async()=>{
  const q=$("searchInput").value.trim();

  if(!q){
   $("searchResults").innerHTML="";
   return;
  }

  const {data,error}=await SB.from("profiles")
   .select("*")
   .ilike("username","%"+q+"%")
   .neq("id",user.id)
   .limit(30);

  if(error)return toast(error.message);

  $("searchResults").innerHTML=(data||[]).map(p=>`
   <div class="person">
    <img class="avatar" src="${avatar(p.avatar_url,p.username)}">
    <div class="person-info">
     <b>${esc(p.username)}</b>
     <span>${esc(p.bio||"PicFlow user")}</span>
    </div>
    <button class="follow-btn"
     onclick="openProfile('${p.id}')">View</button>
   </div>
  `).join("")||'<div class="empty">No users found</div>';
 },250);
}

async function openNotifications(){
 const {data:rows}=await SB.from("notifications")
 .select("*")
 .eq("user_id",user.id)
 .order("created_at",{ascending:false})
 .limit(50);

 let html='<div class="modal-title">Notifications</div>';

 for(const n of rows||[]){
  html+=`
   <div class="person">
    <div style="font-size:25px">🔔</div>
    <div class="person-info">
     <b>${esc(n.message||"New notification")}</b>
     <span>${new Date(n.created_at).toLocaleString()}</span>
    </div>
   </div>`;
 }

 if(!rows?.length)
  html+='<div class="empty">No notifications yet</div>';

 showModal(html);
}

async function openMessages(){
 const {data:msgs}=await SB.from("messages")
 .select("*")
 .or("sender_id.eq."+user.id+",receiver_id.eq."+user.id)
 .order("created_at",{ascending:false})
 .limit(50);

 let html=`
  <div class="modal-title">Messages</div>
  <div class="empty">
   💬 Messaging is ready.<br>
   Select a user from Search to start a conversation.
  </div>`;

}

async function openSaved(){
 const {data:rows}=await SB.from("saved_posts")
  .select("post_id")
  .eq("user_id",user.id);

 if(!rows?.length)
  return showModal(`
   <div class="modal-title">Saved</div>
   <div class="empty">No saved posts 🔖</div>`);

 const ids=rows.map(x=>x.post_id);

 const {data:posts}=await SB.from("posts")
  .select("*")
  .in("id",ids)
  .order("created_at",{ascending:false});

 let grid="";

 for(const p of posts||[]){
  grid+=p.media_type==="video"
   ? `<video src="${esc(p.media_url)}" controls></video>`
   : `<img src="${esc(p.media_url)}">`;
 }

 showModal(`
  <div class="modal-title">Saved</div>
  <div class="grid">${grid}</div>
 `);
}

   <span>Account</span><span>👤</span>
  </div>

  <div class="setting" onclick="editProfile()">

async function openFollowers(uid,type){
 const column=type==="followers"?"following_id":"follower_id";
 const target=type==="followers"?"follower_id":"following_id";

 const {data:rows}=await SB.from("follows")
  .select("*")
  .eq(column,uid);

 let html=`
  <div class="modal-title">
   ${type==="followers"?"Followers":"Following"}
  </div>`;

 for(const r of rows||[]){
  const id=r[target];

  const {data:p}=await SB.from("profiles")
   .select("*").eq("id",id).maybeSingle();

  if(p){
   html+=`
    <div class="person">
     <img class="avatar" src="${avatar(p.avatar_url,p.username)}">
     <div class="person-info"><b>${esc(p.username)}</b></div>
     <button class="follow-btn"
      onclick="openProfile('${p.id}')">View</button>
    </div>`;
  }
 }

 showModal(html);
}

function go(page){

}

function showModal(content){
 closeModal();

 const m=document.createElement("div");
 m.id="masterModal";
 m.className="modal";

 m.innerHTML=`
  <div class="sheet">
   <button class="close" onclick="closeModal()">×</button>
   ${content}
  </div>`;

 m.addEventListener("click",e=>{
  if(e.target===m)closeModal();
 });

 document.body.appendChild(m);
}

function closeModal(){
 $("masterModal")?.remove();
}

function viewStory(url){
 showModal(`
  <div class="modal-title">Story</div>
  <img src="${esc(url)}" style="width:100%;max-height:70vh;object-fit:contain">
 `);
}

(async()=>{
