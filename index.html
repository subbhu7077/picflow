<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicFlow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fafafa; color: #262626; padding-bottom: 70px; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #dbdbdb; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; z-index: 50; }
    .logo { font-size: 1.4rem; font-weight: 700; font-family: 'Brush Script MT', cursive, sans-serif; }
    .header-icons i { font-size: 1.3rem; margin-left: 18px; cursor: pointer; }
    .stories-container { display: flex; overflow-x: auto; padding: 14px 10px; background: #fff; border-bottom: 1px solid #dbdbdb; gap: 14px; }
    .stories-container::-webkit-scrollbar { display: none; }
    .story { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .story-ring { width: 64px; height: 64px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); display: flex; align-items: center; justify-content: center; }
    .story-img { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
    .feed { max-width: 470px; margin: 15px auto; display: flex; flex-direction: column; gap: 18px; }
    .post { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; overflow: hidden; }
    .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .post-user { display: flex; align-items: center; gap: 10px; }
    .post-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .post-username { font-size: 13px; font-weight: 600; }
    .post-image { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #000; }
    .post-actions { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 1.3rem; }
    .post-actions-left { display: flex; gap: 14px; }
    .post-actions i { cursor: pointer; }
    .post-actions .fa-heart.liked { color: #ed4956; }
    .post-meta { padding: 0 14px 12px; font-size: 13px; }
    .likes-count { font-weight: 600; margin-bottom: 6px; }
    .caption span { font-weight: 600; margin-right: 6px; }
    .comments-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .add-comment { display: flex; border-top: 1px solid #efefef; padding: 8px 14px; margin-top: 8px; }
    .add-comment input { flex: 1; border: none; outline: none; font-size: 13px; }
    .add-comment button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; }
    nav.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #fff; border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    nav.bottom-bar i { font-size: 1.3rem; cursor: pointer; color: #262626; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-box { background: #fff; width: 90%; max-width: 420px; border-radius: 12px; padding: 18px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 14px; font-size: 18px; cursor: pointer; }
    .modal input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #dbdbdb; border-radius: 6px; }
    .btn-submit { width: 100%; padding: 10px; background: #0095f6; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    #storyViewer { display: none; position: fixed; inset: 0; background: #000; z-index: 200; justify-content: center; align-items: center; }
    #storyViewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <div class="logo">PicFlow</div>
    <div class="header-icons">
      <i class="fa-regular fa-heart" onclick="alert('No notifications')"></i>
      <i class="fa-brands fa-facebook-messenger" onclick="alert('Chats loaded')"></i>
    </div>
  </header>

  <div class="stories-container" id="storiesContainer"></div>
  <main class="feed" id="feedContainer"></main>

  <nav class="bottom-bar">
    <i class="fa-solid fa-house" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"></i>
    <i class="fa-solid fa-magnifying-glass" onclick="alert('Explore')"></i>
    <i class="fa-regular fa-square-plus" onclick="openCreateModal()"></i>
    <i class="fa-solid fa-clapperboard" onclick="alert('Reels')"></i>
    <i class="fa-regular fa-user" onclick="alert('Profile')"></i>
  </nav>

  <div class="modal" id="createModal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeCreateModal()">&times;</span>
      <h3>Create New Post</h3>
      <input type="file" id="postImageInput" accept="image/*" />
      <input type="text" id="postCaptionInput" placeholder="Write a caption..." />
      <button class="btn-submit" onclick="submitPost()">Share Post</button>
    </div>
  </div>

  <div id="storyViewer" onclick="closeStoryViewer()">
    <img id="activeStoryImg" src="" alt="Story" />
  </div>

  <script src="js/master.js?v=master3"></script>
</body>
</html>
